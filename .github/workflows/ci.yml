# Every pull request and every push to main: the backend suite on a real
# PostgreSQL (engine and architecture tests included, engine coverage at
# least 80%), the data packs, the migrations against the models, the app's
# type check, tests, lint and web build, a dependency audit, a secrets scan
# and the repository's own rules, and a scan of the container image for known
# flaws. The same checks we run by hand before a merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to a commit, not a tag: a tag can be moved to other code, as happened to 76 of trivy-action's
# 77 tags in March 2026 (CVE-2026-33634). The comment names the release; update both together (security sweep 3).

jobs:
  backend:
    name: Backend, engine and data (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campus_chommie
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: campus_chommie_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campus_chommie"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Made-up values for CI only; no real secret is used or needed.
      POSTGRES_USER: campus_chommie
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_DB: campus_chommie_dev
      POSTGRES_TEST_DB: campus_chommie_test
      MAIL_PROVIDER: fake
      SECRET_KEY: ci-only-secret-key-used-nowhere-else-000000
      JWT_SECRET_KEY: ci-only-jwt-secret-key-used-nowhere-else-00
      TZ: Africa/Johannesburg
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Data packs (broken references or an incomplete release pack fail)
        run: python scripts/validate_data.py
      - name: Migrations build the database and match the models
        env:
          FLASK_APP: app.py
          FLASK_ENV: testing
        run: flask db upgrade && flask db check
      - name: Backend tests, with the engine's coverage
        run: python -m pytest -q -p no:warnings tests --cov=campus_engine --cov-report=term --cov-fail-under=80

  container:
    name: Backend container (build, migrate, health)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campus_chommie
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: campus_chommie_container
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campus_chommie"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the image
        run: docker build -t campus-chommie-api backend
      # Known flaws in the image (Debian, the Python runtime and our packages): fail on a high or critical one that has
      # a fix we haven't taken. Trivy's official image, pinned by digest to 0.75.0, never trivy-action (see above).
      - name: Scan the image (Trivy)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 campus-chommie-api
      - name: Start it as a host would, against an empty database
        # Made-up values for CI only; no real secret is used or needed.
        run: >-
          docker run -d --name api --network host
          -e DATABASE_URL=postgresql://campus_chommie:ci-only-password@localhost:5432/campus_chommie_container
          -e SECRET_KEY=ci-only-secret-key-used-nowhere-else-000000
          -e JWT_SECRET_KEY=ci-only-jwt-secret-key-used-nowhere-else-00
          -e MAIL_SERVER=smtp.invalid -e MAIL_USERNAME=ci -e MAIL_PASSWORD=ci-only
          -e "MAIL_DEFAULT_SENDER=Campus Chommie <ci@example.com>"
          -e APP_BASE_URL=https://api.example.com
          campus-chommie-api
      - name: The migrations ran, it answers its health check, and it runs the jobs as a normal user
        run: |
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/api/v1/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/v1/health
          docker logs api 2>&1 | grep -q "Running upgrade"
          test "$(docker logs api 2>&1 | grep -c 'master scheduler: started')" = 1
          test "$(docker exec api id -un)" = campus
      - name: The container's log, if anything failed
        if: failure()
        run: docker logs api

  app:
    name: App (tsc, jest, lint, web build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json
      - run: npm ci
      # Expo writes this file on first start; it's gitignored.
      - run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
      - run: npx tsc --noEmit
      - run: npx jest --silent
      - run: npx eslint . --max-warnings=0
      - name: Web build
        run: npx expo export --platform web --output-dir dist

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # PYSEC-2026-4146 (PyJWT), accepted on 9 Oct, is no longer reported (21 Oct 2026), so nothing is ignored.
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
      # Code scan: fail on any medium or high finding. The two reviewed false positives carry "# nosec <rule>", with the reason on the line above
      # where they are (docs/SECURITY.md, security sweep 1).
      - run: pip install bandit==1.9.4 && bandit -r backend/src backend/campus_engine backend/scripts -ll -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # What the app depends on: fail on any high or critical advisory except
      # the ones accepted, with reasons and review dates, in audit-allowlist.json.
      - run: |
          npm audit --omit=dev --json > audit.json || true
          node scripts/check-audit.mjs audit.json
        working-directory: frontend/mobile

  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .

  repo:
    name: Repository rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Only REUSE.md may name the project this one reuses (brief section 4).
      # The name is split in two so this file doesn't match itself.
      - run: |
          found="$(git grep -il "akay""za" || true)"
          if [ "$found" != "REUSE.md" ]; then
            echo "Only REUSE.md may name it. Found in:"; echo "$found"; exit 1
          fi
