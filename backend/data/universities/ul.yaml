# University of Limpopo (UL)
#
# Agent draft, from UL's 2027 Undergraduate Prospectus read on 14 Oct 2026 (docs/research/ul.md).
# Nobody has checked these values yet: release stays false until a person has compared every
# one with its source. All 54 undergraduate programmes take their requirements from the 2027
# prospectus. Bank details in UL's document are left out on purpose.

university: ul
name: University of Limpopo
city: Polokwane
academic_year: 2027
province: Limpopo
province_source: s-ul-where
release: false
max_choices: null

points_rules:
  source: s-ul-prospectus-2027
  subjects_counted: 6          # six recognised 20-credit subjects
  life_orientation: exclude
  note: "UL requires Life Orientation at level 3 or more for admission, but does not count it in the APS."
  scale:
    - {min_percent: 80, level: 7}
    - {min_percent: 70, level: 6}
    - {min_percent: 60, level: 5}
    - {min_percent: 50, level: 4}
    - {min_percent: 40, level: 3}
    - {min_percent: 30, level: 2}
    - {min_percent: 0, level: 1}

applications:
  source: s-ul-2027
  url: https://www.ul.ac.za/study-with-us-university-of-limpopo-2027-application-now-open/
  how: "Apply online on UL's student I-Enabler portal with your own valid email address."
  fee_cents: 20000
  fee_note: "Non-refundable application handling fee."
  documents:
    source: s-ul-prospectus-2027
    items:
      - "Certified copy of your ID document or passport"
      - "Certified copy of Grade 11 final stamped results (if in Grade 12) or statement of Grade 12 results / National Senior Certificate"
      - "Academic record and certificate of good conduct (if transferring from another tertiary institution)"
      - "Proof of foreign exemption evaluation certificate from USAf / SAQA (for international qualifications)"
  after:
    - text: "Meeting the minimum APS for a particular programme does not guarantee admission, as places are limited."
      source: s-ul-prospectus-2027
    - text: "Life Orientation with an achievement level of at least 3 (40%) and English with at least level 3 (40%) are required for entry to any undergraduate programme."
      source: s-ul-prospectus-2027
  windows:
    - intake: 2027
      source: s-ul-2027
      opens: 2026-04-01
      closes: 2026-09-30
      programme_closes:
        - closes: 2026-07-30
          programmes: [mbchb]
          source: s-ul-2027
      note: "MBChB (Medicine) and international applications closed on 30 July 2026. General undergraduate applications closed on 30 September 2026."

