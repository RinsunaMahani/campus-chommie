# Nelson Mandela University (NMU)
#
# Agent draft, read on 13 Oct 2026 (docs/research/universities.md). NMU's Applicant Score adds six
# subjects' percentages, out of 600. Nobody has checked these values yet: release stays false until a
# person has compared every one with its source.
#
# The 124 programmes (agent draft, 15 Oct 2026) and their Applicant Score and subject minimums come from NMU's
# 2027 Undergraduate Guide; docs/research/nmu.md says what was read, what was left out and what to check first.

university: nmu
name: Nelson Mandela University
city: Gqeberha and George
academic_year: 2027
release: false
max_choices: null

points_rules:
  source: s-nmu-as
  subjects_counted: 6
  life_orientation: exclude
  percent_points: {per_percent: 1, from_percent: 0}
  note: "Your Applicant Score is out of 600: NMU always counts your two languages and Mathematics, Mathematical Literacy or Technical Mathematics. Learners at quintile 1 to 3 schools with 50% or more in Life Orientation get 7 more points, which we can't add without asking about your school."
  scale:
    - {min_percent: 80, level: 7}
    - {min_percent: 70, level: 6}
    - {min_percent: 60, level: 5}
    - {min_percent: 50, level: 4}
    - {min_percent: 40, level: 3}
    - {min_percent: 30, level: 2}
    - {min_percent: 0, level: 1}

applications:
  source: s-nmu-closing
  url: https://www.mandela.ac.za/Study-at-Mandela/Application/Closing-dates
  fee_cents: 0
  fee_note: "South African applicants pay no application fee."
  windows:
    - intake: 2027
      source: s-nmu-closing
      opens: null
      closes: 2026-09-30
      note: "MBChB, Pharmacy, Radiography and Nursing closed on 30 June 2026, and early applications on 3 August; the rest closed on 30 September."

# Campuses from the university's own page (s-nmu-campuses), read on 22 Oct 2026. Agent draft.
campuses:
  - {id: south, name: "South", source: s-nmu-campuses}
  - {id: north, name: "North", source: s-nmu-campuses}
  - {id: second_avenue, name: "Second Avenue", source: s-nmu-campuses}
  - {id: bird_street, name: "Bird Street", source: s-nmu-campuses}
  - {id: missionvale, name: "Missionvale", source: s-nmu-campuses}
  - {id: ocean_sciences, name: "Ocean Sciences", source: s-nmu-campuses}
  - {id: george, name: "George", source: s-nmu-campuses}

programmes:

  # Faculty of Business and Economic Sciences (2027 Undergraduate Guide, pages 22 to 43).
  # NMU publishes three Applicant Scores per programme: with Mathematics, Technical Mathematics or Mathematical Literacy.

  # page 22
  - id: hcert_accountancy
    name: "Higher Certificate in Accountancy"
    faculty: "Faculty of Business and Economic Sciences"
    fields: [accounting, finance]
    requirements:
      source: s-nmu-ug-guide-2027
      min_points: 290
      choices:
        - one_of:
            - subjects: {mathematics: 2}
            - subjects: {technical_mathematics: 2}
            - subjects: {mathematical_literacy: 5}
              min_points: 305
      extras:
        - "Applicant Score needed: 290 with Mathematics or Technical Mathematics; 305 with Mathematical Literacy."
        - "Mathematics rule: Mathematics or Technical Mathematics 35%, or Mathematical Literacy 60%."
        - "The app checks either/or subjects by NSC level: here it accepts Mathematics or Technical Mathematics from 30% (NMU asks 35%), so make sure your mark reaches NMU's own figure."
        - "Graduates who finish in one year with more than 50% in every module may be considered for the Diploma in Accountancy."

