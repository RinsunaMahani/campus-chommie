# Stellenbosch University (SU)
#
# Agent draft, read on 13 Oct 2026 (docs/research/universities.md). Stellenbosch selects on averages of
# your marks, programme by programme, not on a points score: no points rule yet. Nobody has checked these
# values yet: release stays false until a person has compared every one with its source.
#
# The 73 programmes (agent draft, 15 Oct 2026) come from SU's 2026 NSC/IEB undergraduate prospectus, the newest we
# could read: the 2027 edition sits on files.su.ac.za, whose robots.txt answered 403, so a person must download it and
# compare every figure; docs/research/su.md says what was read, what was left out and what to check first.

university: su
name: Stellenbosch University
city: Stellenbosch
academic_year: 2027
release: false
max_choices: 3

points_rules: null
points_note: "Stellenbosch selects on averages of your marks, programme by programme, not on a points score."
# From Stellenbosch's 2026 prospectus, page 10. Agent draft.
points_how:
  source: s-su-prospectus-2026
  text: "Stellenbosch selects on your average, programme by programme: the average of your six best subjects' percentages, without Life Orientation. Each programme says the average it asks for."
  average_of_best: 6

applications:
  source: s-su-howto
  url: https://blogs.sun.ac.za/open-day/files/2026/03/How-to-Apply-Undergraduate-programmes-2027-intake.pdf
  how: "Create an online profile and apply. You can be offered more than one of your three choices, and accept one at a time."
  fee_cents: 10000
  fee_note: "For South African applicants. SU waives it for some schools, by quintile."
  windows:
    - intake: 2027
      source: s-su-howto
      opens: 2026-04-01              # the 2027-intake guide (published March 2026): "apply ... from 1 April" (checked 20 Oct 2026)
      closes: 2026-07-31
      note: "The Diploma in Public Accountability closes on 15 December 2026."

# Campuses from the university's own page (s-su-prospectus-2026), read on 22 Oct 2026. Agent draft.
campuses:
  - {id: stellenbosch, name: "Stellenbosch", source: s-su-prospectus-2026}
  - {id: tygerberg, name: "Tygerberg (Health Sciences)", source: s-su-prospectus-2026}

programmes:

  # Every requirement below (except the BEng extended programmes) is from SU's 2026 prospectus, pages 2 to 15. SU
  # says all its programmes are selection programmes: it gets more applications than it has places, and meeting the
  # minimums doesn't guarantee a place (prospectus, page 2). Averages exclude Life Orientation; the app can't check
  # an average yet, so each one is in extras. Where SU names "English or Afrikaans", the pack's either/or uses english
  # or other_language, and other_language only counts if it is Afrikaans (said in extras).

  # Faculty of AgriSciences (prospectus pages 2 to 4)

  - id: bagric_agribusiness_management
    name: "BAgric in Agribusiness Management"
    faculty: "Faculty of AgriSciences"
    fields: [agriculture, management, economics]
    selective: true
    selection_note: &su_sel "SU selects among applicants who meet the minimums, by each faculty's selection guidelines; meeting them doesn't guarantee a place."
    requirements:
      source: s-su-prospectus-2026
      min_points: null
      subject_min_percents: {mathematics: 60, physical_sciences: 50}
      choices: &su_lang_ea
        - one_of:
            - subjects: {english: 4}
            - subjects: {other_language: 4}
      extras:
        - &su_2026 "From SU's 2026 prospectus, the newest we could read: check SU's 2027 prospectus before you rely on these figures."
        - &su_avg60 "SU asks for an NSC average of at least 60%, without Life Orientation. The app can't check averages yet."
        - &su_lang_ea_text "English or Afrikaans (Home Language or First Additional Language) at 50% or more."
        - "Physical Sciences means Physics and Chemistry. The programme takes three years."

