# Cape Peninsula University of Technology (CPUT)
#
# Agent draft, read on 13 Oct 2026 (docs/research/universities.md). CPUT's site sent an incomplete
# certificate chain that day, so these values came from a search engine's copy of CPUT's pages. Its points
# method wasn't found: no points rule yet. Nobody has checked these values yet: release stays false until
# a person has compared every one with its source.
#
# The 119 programmes (agent draft, 15 Oct 2026) come from CPUT's online prospectus for the 2027 intake
# (prospectus.cput.ac.za, one course page per qualification code, noted beside each programme), with the
# Health and Wellness Sciences APS tables and department pages where the course page is blank;
# docs/research/cput.md says what was read, what was left out and what to check first.

university: cput
name: Cape Peninsula University of Technology
city: Cape Town
academic_year: 2027
release: false
max_choices: null

points_rules: null
points_note: "CPUT counts its APS differently from faculty to faculty, so we can't check most of its programmes yet; its health programmes show their own points."

applications:
  source: s-cput-apply
  url: https://www.cput.ac.za/study-at-cput/undergraduate/apply
  fee_cents: 0
  fee_note: "Applying online is free; a paper application costs R100."
  windows:
    - intake: 2027
      source: s-cput-apply
      opens: null
      closes_one_of: [2026-06-30, 2026-07-31, 2026-08-31, 2026-09-30]
      note: "Each CPUT programme has its own closing date."

