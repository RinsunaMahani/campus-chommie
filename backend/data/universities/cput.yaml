# Cape Peninsula University of Technology (CPUT)
#
# Agent draft, read on 13 Oct 2026 (docs/research/universities.md). CPUT's site sent an incomplete
# certificate chain that day, so these values came from a search engine's copy of CPUT's pages. Its points
# method wasn't found: no points rule yet. Nobody has checked these values yet: release stays false until
# a person has compared every one with its source.
#
# The 119 programmes (agent draft, 15 Oct 2026) come from CPUT's online prospectus for the 2027 intake
# (prospectus.cput.ac.za, one course page per qualification code, noted beside each programme), with the
# Health and Wellness Sciences APS tables and department pages where the course page is blank;
# docs/research/cput.md says what was read, what was left out and what to check first.
# On 24 Oct 2026 the supplied 2027 PDF filled 40 missing requirements; see
# docs/research/2027-local-prospectuses.md for page references and remaining ambiguities.

university: cput
name: Cape Peninsula University of Technology
city: Cape Town
academic_year: 2027
province: Western Cape
province_source: s-cput-where
institution_type: university_of_technology   # its official name, and its own page, say it is a university of technology
institution_type_source: s-cput-where
release: false
max_choices: null

points_rules: null
points_note: "CPUT uses different APS methods. Programmes with a sourced method show calculated points; others check subjects and ask you to confirm APS with CPUT."
# From CPUT's "Calculating the APS score: Method 2" table on its engineering course pages. Agent draft.
points_how:
  source: s-cput-prospectus-2027
  text: "CPUT's faculties count points differently. For engineering programmes that use Method 2, add English, Mathematics twice, Physical Sciences twice and your next best subject's percentages, then divide by 10. Check the programme's own method; Construction uses NSC levels."

applications:
  source: s-cput-apply
  url: https://www.cput.ac.za/study-at-cput/undergraduate/apply
  fee_cents: 0
  fee_note: "Applying online is free; a paper application costs R100."
  windows:
    - intake: 2027
      source: s-cput-apply
      opens: 2026-05-11              # "Applications for the 2027 intake opens Monday, 11 May 2026" (checked 20 Oct 2026)
      closes_one_of: [2026-06-30, 2026-07-31, 2026-08-31, 2026-09-30]
      note: "Each CPUT programme has its own closing date."

# Campuses from the university's own page (s-cput-campuses), read on 22 Oct 2026. Agent draft.
campuses:
  - {id: bellville, name: "Bellville", source: s-cput-campuses}
  - {id: district_six, name: "District Six", source: s-cput-campuses}
  - {id: granger_bay, name: "Granger Bay", source: s-cput-campuses}
  - {id: mowbray, name: "Mowbray", source: s-cput-campuses}
  - {id: wellington, name: "Wellington", source: s-cput-campuses}

