  # ---------------------------------------------------------------------------------------------------------
  # Health and Wellness Sciences. Course pages: course-details?q=<code>&f=180, each showing the faculty's APS
  # table for that programme (one source per table). The faculty states how it counts: the percentages of
  # the 6 highest subjects without Life Orientation, added up and divided by 10. So these programmes carry
  # that rule. Every table says places are limited and first-choice applicants come first.
  # ---------------------------------------------------------------------------------------------------------

  - id: bhsc_medical_laboratory_science    # BPMLSC
    name: "Bachelor of Health Sciences in Medical Laboratory Science"
    fields: [medical_sciences, health_sciences]
    selective: true
    places: 45
    selection_note: &cput_fhws_sel "Places are limited: CPUT's health faculty puts first-choice applicants first and prefers higher results in the required subjects and a higher APS."
    requirements:
      source: s-cput-aps-bpmlsc
      min_points: 38
      subject_minimums: {english: 4, mathematics: 4, life_sciences: 5, physical_sciences: 4}
      extras:
        - "English Home Language or First Additional Language."
        - *cput_degree_pass
        - &cput_hepb "You must show proof of your first Hepatitis B vaccination when the programme starts in January."
    points_rules:
      source: s-cput-aps-bpmlsc
      subjects_counted: 6
      life_orientation: exclude
      percent_points: {per_percent: 0.1}
      note: &cput_fhws_note "CPUT's health faculty adds the percentages of your 6 highest subjects, without Life Orientation, and divides by 10: 57% adds 5.7."
      scale: &cput_nsc_scale
        - {min_percent: 80, level: 7}
        - {min_percent: 70, level: 6}
        - {min_percent: 60, level: 5}
        - {min_percent: 50, level: 4}
        - {min_percent: 40, level: 3}
        - {min_percent: 30, level: 2}
        - {min_percent: 0, level: 1}

