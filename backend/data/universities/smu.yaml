# Not found: a 24-hour counselling line, and a careers office (the counselling centre offers career counselling).
# SMU has no chaplaincy office: its Religious Desk, the umbrella body of the student church structures, is listed
# instead. Its Harambee Fund (food parcels and sanitary products, SMU news, Oct 2024) publishes no way to ask for
# help, so it waits (docs/OPEN_QUESTIONS.md).
support_services:
  - {kind: health,
     name: "Campus Health and Wellness Centre: minor ailments, first aid, Hepatitis B vaccination, HIV counselling, testing and management, peer health education (free)",
     contact: "012 521 5735", hours: "Mon-Fri 08:00-16:00", source: s-smu-health}
  - {kind: crisis, name: "After hours, weekends and emergencies",
     contact: "Campus control for ambulance services, or 079 417 9546 / 6278", hours: "after hours",
     note: "SMU publishes no 24-hour counselling line.", source: s-smu-health}
  - {kind: counselling,
     name: "Centre for Student Counselling and Development: relationships, careers, stress, anger and grief; help for first-years settling in",
     contact: "012 521 3786; administrator 012 521 4225", hours: "Mon-Fri 08:00-12:00 and 13:00-16:00",
     source: s-smu-counselling}
  - {kind: counselling,
     name: "Student Support Referral Unit: life coaching, and referrals to the social worker, counselling, the clinical psychologist, teaching and learning support, Campus Health and Financial Aid (free for registered students)",
     contact: "012 521 3805; Clinpath Building, room 3L003", source: s-smu-referral}
  - {kind: financial_aid, name: "Financial Aid Office: fee blocks and financial clearance",
     contact: "012 521 4614 / 4500 / 4317; financialaid@smu.ac.za", source: s-smu-reg-2026}
  - {kind: food_support,
     name: "SMU Community Garden: fresh vegetables for students in need (more than 15 a week, SMU said in March 2026)",
     contact: "On campus; SMU names horticulturist Mpho Mmako as the project's representative",
     note: "SMU doesn't publish how students ask for vegetables.", source: s-smu-garden-2026}
  - {kind: chaplaincy,
     name: "Religious Desk (Student Life and Governance): the umbrella body of the student church structures, from Orthodox to contemporary",
     contact: "012 521 5836 or 012 521 5835; Natural Science Building, ground floor", hours: "Mon-Fri 07:30-16:00",
     note: "SMU has no chaplaincy office: this is the closest.", source: s-smu-life-gov}

