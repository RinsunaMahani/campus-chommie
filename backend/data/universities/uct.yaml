        - "Guaranteed admission with an FPS of 730 or more; likely admission with a Weighted Points Score (your FPS raised by UCT's disadvantage factor of up to 20%, South African applicants only) of 782 or more; possible admission for South African applicants in UCT's redress categories with an FPS of 565, 580 or 670 or more depending on the category. All bands need Intermediate or above in the NBTs."
