      choices:
        - one_of:
            - subjects: {physical_sciences: 5}
            - subjects: {life_sciences: 5}
      additional_minimums: [5, 5, 5]
      extras:
        - &uct_hs_pslsc "Physical Sciences or Life Sciences at 65% or more: level 5 starts at 60%, so check your percentage."
        - "English Home Language or First Additional Language at 65% or more, and at least 60% in each of your next three best subjects other than Life Orientation."
        - "Your Admission Points Score (out of 600) must be at least 360."
        - "Guaranteed admission with an FPS of 730 or more; likely admission with a Weighted Points Score (your FPS raised by UCT's disadvantage factor of up to 20%, South African applicants only) of 797 or more; possible admission for South African applicants in UCT's redress categories with an FPS of 580, 610 or 680 or more depending on the category. All bands need Intermediate or above in the three NBTs."
