  # Health Sciences (prospectus pages 39 to 47). Places are from page 41.

  - id: mbchb
    name: "Bachelor of Medicine and Bachelor of Surgery (MBChB)"
    faculty: "Faculty of Health Sciences"
    fields: [medicine]
    selective: true
    places: 240
    selection_note: &uct_hs_sel "UCT's Health Sciences faculty receives far more applications than it has places, and competition is significant. It ranks applicants by a Faculty Points Score out of 900: your Admission Points Score (English, Mathematics, Physical Sciences and your next three best subjects' percentages, without Life Orientation) plus your three NBT scores. First-choice applicants are prioritised."
    requirements:
      source: s-uct-prospectus-2027
      min_points: null
      subject_min_percents: {mathematics: 70, physical_sciences: 70, english: 65}
      additional_minimums: [6, 6, 6]
      extras:
        - "English Home Language or First Additional Language at 65% or more, and at least 70% in each of your next three best subjects other than Life Orientation."
        - "Your Admission Points Score (out of 600) must be at least 450."
        - "Guaranteed admission with an FPS of 810 or more and Proficient in all three NBTs; likely admission with a Weighted Points Score (your FPS raised by UCT's disadvantage factor of up to 20%, South African applicants only) of 807 or more and Intermediate or above in the NBTs; possible admission with an FPS of 644 or more, for South African applicants in UCT's redress categories only."
        - &uct_hs_nbt "Write the National Benchmark Tests (Academic and Quantitative Literacy, and Mathematics) by 31 July 2026 to be considered for a conditional offer; the last date for UCT is 3 October 2026."
        - &uct_hs_res "Open to South African citizens and permanent residents, and to applicants from some SADC countries only (prospectus, page 41)."

