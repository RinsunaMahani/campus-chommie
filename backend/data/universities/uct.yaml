        - *uct_hum_eng
        - "Also Unisa Music Theory Grade V and Unisa Music Practical Grade VII or above. UCT's NSC guidelines say NSC Music at 60% 'or equivalent'."
        - "A four-year degree; the 2027 directions for applicants list the General, African Music Performance and Jazz Studies streams."

  - id: dip_music_performance
