  # Law (prospectus pages 59 to 63): only the four-year LLB takes school-leavers.

  - id: llb
    name: "Bachelor of Laws (LLB), four years"
    faculty: "Faculty of Law"
    fields: [law]
    selective: true
    selection_note: "Applications far exceed the places: if more applicants meet the criteria than there are places, only the best get offers. UCT considers your school results and your NBT Academic and Quantitative Literacy scores."
    requirements:
      source: s-uct-prospectus-2027
      min_points: null
      extras:
        - "UCT ranks Law applicants by a Faculty Points Score (FPS): six subjects' percentages, out of 600: English, any subject the programme requires and your best other subjects, without Life Orientation (UCT's 2027 prospectus, pages 15 and 16). The app can't work this out for you yet. UCT names no subject minimums for the LLB."
        - "Guaranteed admission with an FPS of 500 or more, Proficient in NBT Academic Literacy and Intermediate or above in Quantitative Literacy; likely admission with a Weighted Points Score (your FPS raised by UCT's disadvantage factor, South African applicants only) of 500 or more and the same NBT scores; possible admission with an FPS of 470 or more and Proficient in both, for South African applicants in UCT's redress categories only. International applicants need an FPS of 510."
        - "Other routes to an LLB: a BA, BSocSc, BCom or BBusSc with Law courses, then a two-year graduate LLB."

  # Science (prospectus pages 64 to 70): one degree, the BSc, with two majors chosen when you apply.

  - id: bsc
    name: "Bachelor of Science (BSc)"
    faculty: "Faculty of Science"
    fields: [natural_sciences, physical_sciences, life_sciences]
    requirements:
      source: s-uct-prospectus-2027
      min_points: null
      subject_min_percents: {mathematics: 70}
      choices:
        - one_of:
            - subjects: {physical_sciences: 5}
            - subjects: {information_technology: 5}
      extras:
        - &uct_sci_fps "UCT ranks Science applicants by a Faculty Points Score (FPS) out of 800: your best six subjects' percentages, including English and without Life Orientation, with Mathematics and Physical Sciences counted twice (UCT's 2027 prospectus, page 69). The app can't work this out for you yet."
        - &uct_sci_bands "Minimum FPS 550. Guaranteed admission with an FPS of 660 or more; likely admission with a Weighted Points Score (your FPS raised by UCT's disadvantage factor, South African applicants only) of 640 or more; an FPS of 550 or more is possible admission for South African applicants in UCT's redress categories. Most offers go to applicants in the guaranteed band."
        - "Physical Sciences at 60% or more. Information Technology at 60% can replace it only for the Computer Science and Business Computing majors, where you didn't take Physical Sciences."
        - &uct_sci_nbt "Write all three National Benchmark Tests: they aren't used for admission, but they help decide who moves to the four-year Extended Degree Programme."
        - "Majors: Applied Mathematics, Applied Statistics, Archaeology, Artificial Intelligence, Astrophysics, Biochemistry, Biology, Business Computing, Chemistry, Computer Engineering, Computer Science, Environmental & Geographical Science, Genetics, Geology, Human Anatomy & Physiology, Marine Biology, Mathematical Statistics, Mathematics, Ocean & Atmosphere Science, Physics, Quantitative Biology, and Statistics & Data Science. Biochemistry, Computer Science (and related majors), Genetics, and Human Anatomy & Physiology have limited places, given on academic criteria during the first year."

  - id: bsc_archaeology_egs
    name: "Bachelor of Science (BSc) without Physical Sciences: Archaeology, or Environmental & Geographical Science"
    faculty: "Faculty of Science"
    fields: [earth_sciences, natural_sciences]
    requirements:
      source: s-uct-prospectus-2027
      min_points: null
      subject_min_percents: {mathematics: 70}
      extras:
        - "Without Physical Sciences or Information Technology, UCT restricts your majors to Archaeology and Environmental & Geographical Science."
        - *uct_sci_fps
        - "Without Physical Sciences, UCT may count Information Technology or Life Sciences twice instead, in specific cases only."
        - *uct_sci_bands
        - *uct_sci_nbt

