    name: "Bachelor of Arts in Fine Art"
    faculty: "Faculty of Humanities"
    fields: [arts_and_design]
    selective: true
    selection_note: "A portfolio evaluation and a supplementary questionnaire: the portfolio is the leading indicator for admission, and places are awarded on merit."
    requirements:
      source: s-uct-prospectus-2027
      min_points: null
      subject_min_percents: {english: 50, life_orientation: 50}
      extras:
        - *uct_hum_fps
        - "Minimum: an FPS of 380 and Intermediate in the NBT Academic Literacy test. South African applicants in UCT's redress categories who excel in the portfolio may be considered below these minimums."
        - *uct_hum_eng

  - id: ba_theatre_performance
    name: "Bachelor of Arts in Theatre & Performance"
    faculty: "Faculty of Humanities"
    fields: [performing_arts]
    selective: true
    selection_note: &uct_audition "An audition is the leading indicator for admission, and places are awarded on merit."
    requirements:
      source: s-uct-prospectus-2027
      min_points: null
      subject_min_percents: {english: 50, life_orientation: 50}
      extras:
        - *uct_hum_fps
        - "Minimum: an FPS of 380 and Intermediate in the NBT Academic Literacy test. South African applicants in UCT's redress categories who excel in the audition may be considered for the Diploma in Theatre & Performance instead."
        - *uct_hum_eng
        - "A four-year degree in Dance or Theatre."

  - id: bmus
    name: "Bachelor of Music"
    faculty: "Faculty of Humanities"
    fields: [music, performing_arts]
    selective: true
    selection_note: "An audition, an interview and a music theory test: the audition is the leading indicator for admission, and places are awarded on merit."
    requirements:
