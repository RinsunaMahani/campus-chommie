# University of Cape Town (UCT)
#
# Agent draft, read on 13 Oct 2026 (docs/research/universities.md). UCT ranks applicants by a Faculty
# Points Score its faculties work out their own way, which marks alone don't give us: no points rule yet.
# Nobody has checked these values yet: release stays false until a person has compared every one with its
# source.
#
# The 34 programmes (agent draft, 15 Oct 2026) follow the qualification codes in UCT's 2027 directions for
# applicants, with each one's subject minimums and Faculty Points Score bands from the 2027 Undergraduate Prospectus;
# docs/research/uct.md says what was read, what was left out and what to check first.

university: uct
name: University of Cape Town
city: Cape Town
academic_year: 2027
release: false
max_choices: null

points_rules: null
points_note: "UCT ranks applicants by a Faculty Points Score that each faculty works out its own way."

applications:
  source: s-uct-apply
  url: https://uct.ac.za/students/applications-apply-undergraduate-qualifications/application-procedure
  how: "Apply online, then pay the fee once UCT acknowledges your application, and send the proof of payment to the Admissions Office."
  fee_cents: 10000
  fee_note: "For South African and SADC applicants."
  windows:
    - intake: 2027
      source: s-uct-directions
      opens: null
      closes: 2026-07-31
      note: "Fine Art portfolios were due by 31 August 2026."

programmes:

  # Commerce (prospectus pages 23 to 31). Applicants choose one of four codes (directions, page 17): Actuarial
  # Science, or all other specialisations, each mainstream or Academic Development. The BCom or BBusSc and the
  # specialisation are chosen at the end of Orientation, provided the final marks meet that specialisation's criteria.

  - id: bcom_bbussc_general
    name: "Bachelor of Commerce or Bachelor of Business Science: all specialisations other than Actuarial Science"
    faculty: "Faculty of Commerce"
    fields: [commerce, accounting, economics]
    requirements:
      source: s-uct-prospectus-2027
      min_points: null
      subject_min_percents: {mathematics: 60, english: 50}
      extras:
        - &uct_com_fps "UCT ranks Commerce applicants by a Faculty Points Score (FPS): six subjects' percentages, out of 600: English, any subject the programme requires and your best other subjects, without Life Orientation (UCT's 2027 prospectus, pages 15 and 16). The app can't work this out for you yet."
        - &uct_com_bands "Guaranteed admission with an FPS of 435 or more; likely admission with a Weighted Points Score (your FPS raised by UCT's disadvantage factor of up to 10%, South African applicants only) of 470 or more. An FPS of 430 to 434 may lead to an offer in the Education Development Unit only, for South African applicants in UCT's redress categories."
        - &uct_com_eng "English Home Language at 50% or more, or English First Additional Language at 60% or more."
        - &uct_com_nbt "Every Commerce applicant must write the National Benchmark Tests: Academic Literacy and Quantitative Literacy at Upper Intermediate or above. The Mathematics test isn't needed for Commerce."
        - "Specialisations named in the prospectus: BBusSc in Economics, Economics with Law, Finance, Investment and Banking, Finance with Accounting, Information Systems, Marketing, and Industrial and Organisational Psychology; BCom in Financial Accounting (General or Chartered Accountant), Economics with Law, Economics with Finance, Economics and Statistics, Information Systems, Information Systems and Finance, Management Studies, and Philosophy, Politics and Economics. Computer Science and Statistics and Data Science need Mathematics at 70% (listed separately)."
        - "The BCom takes three years and the BBusSc four."

  - id: bcom_bbussc_computing_data_science
    name: "Bachelor of Commerce or Bachelor of Business Science: Computer Science, or Statistics and Data Science"
    faculty: "Faculty of Commerce"
    fields: [computing, mathematical_sciences, commerce]
    requirements:
      source: s-uct-prospectus-2027
      min_points: null
      subject_min_percents: {mathematics: 70, english: 50}
      extras:
        - "You apply under 'all specialisations other than Actuarial Science' and choose this specialisation at the end of Orientation, if your final marks meet its criteria (UCT's 2027 directions for applicants, page 17)."
        - *uct_com_fps
        - *uct_com_bands
        - *uct_com_eng
        - *uct_com_nbt
        - "The prospectus gives Mathematics 70% for the Computer Science and Statistics and Data Science specialisation. It doesn't say whether the BCom in Information Systems and Computer Science is included: check with UCT."

  - id: bcom_bbussc_actuarial_science
    name: "Bachelor of Commerce or Bachelor of Business Science: Actuarial Science"
    faculty: "Faculty of Commerce"
    fields: [finance, mathematical_sciences, commerce]
    requirements:
      source: s-uct-prospectus-2027
      min_points: null
      subject_min_percents: {mathematics: 80, english: 60}
      extras:
        - *uct_com_fps
        - "Guaranteed admission with an FPS of 500 or more; likely admission with a Weighted Points Score (your FPS raised by UCT's disadvantage factor of up to 10%, South African applicants only) of 525 or more. An FPS of 475 to 479 may lead to an offer in the Education Development Unit only, for South African applicants in UCT's redress categories."
        - &uct_act_eng "English Home Language at 60% or more, or English First Additional Language at 80% or more (and then Proficient in the NBT Academic and Quantitative Literacy tests)."
        - "Every Commerce applicant must write the National Benchmark Tests: Academic Literacy and Quantitative Literacy at Upper Intermediate or above."
        - "Includes the Quantitative Finance stream. If you don't meet the Actuarial Science criteria but do meet the other Commerce criteria, UCT automatically offers you a place in those programmes instead (UCT's 2027 directions for applicants, page 17)."

  - id: bcom_bbussc_general_adp
    name: "Bachelor of Commerce or Bachelor of Business Science: Academic Development Programme (all specialisations other than Actuarial Science)"
    faculty: "Faculty of Commerce"
    fields: [commerce, accounting, economics]
    requirements:
      source: s-uct-prospectus-2027
      min_points: null
      subject_min_percents: {mathematics: 60, english: 50}
      extras:
        - &uct_adp "The Education Development Unit offers the same degrees with extra support, over the standard time or one year longer. UCT says South African applicants with a disadvantage factor above 1.0 may apply, and it may also offer places to applicants who don't meet the mainstream requirements but whose NBT results show potential."
        - *uct_com_fps
        - "The prospectus's figure for an Education Development Unit offer: an FPS of 430 to 434 (Band C, South African applicants in UCT's redress categories only)."
        - *uct_com_eng
        - *uct_com_nbt

  - id: bcom_bbussc_actuarial_science_adp
    name: "Bachelor of Commerce or Bachelor of Business Science: Academic Development Programme (Actuarial Science)"
    faculty: "Faculty of Commerce"
    fields: [finance, mathematical_sciences, commerce]
    requirements:
      source: s-uct-prospectus-2027
      min_points: null
      subject_min_percents: {mathematics: 80, english: 60}
      extras:
        - *uct_adp
        - *uct_com_fps
        - "The prospectus's figure for an Education Development Unit offer: an FPS of 475 to 479 (Band C, South African applicants in UCT's redress categories only)."
        - *uct_act_eng
        - "Every Commerce applicant must write the National Benchmark Tests: Academic Literacy and Quantitative Literacy at Upper Intermediate or above."

