# University of Johannesburg (UJ)
#
# Agent draft, 13 Oct 2026. UJ's site sits behind a bot check that stops automated readers, so these
# values were read from a search engine's copy of UJ's own pages (docs/research/universities.md says
# which). Programmes and support were added from the user-supplied 2027 prospectus on 24 Oct 2026;
# see docs/research/2027-local-prospectuses.md. Sources remain agent drafts.

university: uj
name: University of Johannesburg
city: Johannesburg
academic_year: 2027
release: false
max_choices: 2                 # two undergraduate study choices

points_rules:
  source: s-uj-yearbook
  subjects_counted: 6
  life_orientation: exclude
  scale:
    - {min_percent: 80, level: 7}
    - {min_percent: 70, level: 6}
    - {min_percent: 60, level: 5}
    - {min_percent: 50, level: 4}
    - {min_percent: 40, level: 3}
    - {min_percent: 30, level: 2}
    - {min_percent: 0, level: 1}

applications:
  source: s-uj-undergrad
  url: https://www.uj.ac.za/admission-aid/new/
  how: "Apply online. Once an application is submitted, it can't be changed."
  fee_cents: 0
  windows:
    - intake: 2027
      source: s-uj-undergrad
      opens: 2026-04-01
      closes: 2026-10-31
      closing_time: "12:00"
      no_late_applications: true

# Campuses from the university's own page (s-uj-maps-venues), read in a browser on 22 Oct 2026 (its site refuses
# scripts; docs/research/campuses-uj-uwc.md). Agent draft.
campuses:
  - {id: apk, name: "Auckland Park Kingsway (APK)", source: s-uj-maps-venues}
  - {id: apb, name: "Auckland Park Bunting Road (APB)", source: s-uj-maps-venues}
  - {id: dfc, name: "Doornfontein (DFC)", source: s-uj-maps-venues}
  - {id: swc, name: "Soweto (SWC)", source: s-uj-maps-venues}

