# University of KwaZulu-Natal (UKZN)
#
# Agent draft, read on 13 Oct 2026 (docs/research/universities.md). UKZN's sites didn't answer from our
# network that day, so these values came from a search engine's copy of UKZN's own pages; a person should
# open each and check it. Nobody has checked these values yet: release stays false until a person has
# compared every one with its source. The 66 programmes, added on 22 Oct 2026, come from UKZN's own 2027
# Undergraduate Prospectus, checked against the CAO's 2027 handbook (docs/research/ukzn.md).

university: ukzn
name: University of KwaZulu-Natal
city: Durban and Pietermaritzburg
academic_year: 2027
province: KwaZulu-Natal
province_source: s-ukzn-where
release: false
max_choices: null

points_rules:
  source: s-ukzn-selection
  subjects_counted: 6
  life_orientation: exclude
  note: "UKZN always counts English and Mathematics or Mathematical Literacy, then your best others. Mathematics Paper 3 never counts."
  scale:
    - {min_percent: 90, level: 8}
    - {min_percent: 80, level: 7}
    - {min_percent: 70, level: 6}
    - {min_percent: 60, level: 5}
    - {min_percent: 50, level: 4}
    - {min_percent: 40, level: 3}
    - {min_percent: 30, level: 2}
    - {min_percent: 0, level: 1}

applications:
  source: s-ukzn-2027
  url: https://applications.ukzn.ac.za/
  how: "South Africans applying for the first time apply through the Central Applications Office (CAO), at cao.ac.za."
  fee_cents: 25000
  fee_note: "The CAO's fee: R250 if it reaches the CAO by 31 October 2026, R470 from 1 November."
  windows:
    - intake: 2027
      source: s-ukzn-2027
      opens: null
      closes: 2026-09-30
      programme_closes:
        - closes: 2026-06-30
          source: s-ukzn-prospectus-2027   # printed p10 and p95: MBChB form and payment by 30 June 2026
          programmes: [mbchb]
      note: "Medicine closed on 30 June 2026, with no late applications."

# Campuses from the university's own page (s-ukzn-campuses), read on 22 Oct 2026. Agent draft.
campuses:
  - {id: edgewood, name: "Edgewood (Pinetown)", source: s-ukzn-campuses}
  - {id: howard_college, name: "Howard College (Durban)", source: s-ukzn-campuses}
  - {id: medical_school, name: "Medical School (Durban)", source: s-ukzn-campuses}
  - {id: pietermaritzburg, name: "Pietermaritzburg", source: s-ukzn-campuses}
  - {id: westville, name: "Westville", source: s-ukzn-campuses}

# Requirements from UKZN's 2027 Undergraduate Prospectus (s-ukzn-prospectus-2027): its tables "The following
# programmes are available in 2027" (printed pages 20 to 24) and its college sections (printed pages 80 to 124).
# min_points is the bottom of the table's "APS range" (48-30 gives 30). Every requirement was compared with the
# CAO's 2027 handbook (s-ukzn-cao-2027); where they differ, UKZN's own prospectus is used and an extras line says
# what the CAO says. Each programme's comment gives its CAO code(s) and the prospectus page. Agent draft, 22 Oct 2026.
#
# "One of ... at level 5" in the College of Humanities' rule (Bus Stud, Cons Stud, Dram Arts, Econ, Geog, Hist,
# Info Tech, Life Sci, Maths/Maths Lit, Music, Religion Stud, Vis Arts, any language HL/FAL 5): English itself
# counts as "any language", so English sits inside each option (English 5, or English 4 with another subject at 5).
# Religion Studies isn't a subject the app knows; extras say so.

