# University of Pretoria (UP)
#
# Agent draft, from UP's own documents read on 9 Oct 2026 (docs/research/up.md lists them with
# page numbers). Nobody has checked these values yet: release stays false until a person has
# compared every one with its source. Programmes the schema can't hold yet (music auditions, a
# row missing from UP's table) have requirements: null with the reason beside them.

university: up
name: University of Pretoria
city: Pretoria
academic_year: 2027          # the intake these rules apply to
release: false
max_choices: null            # not found in UP's documents

points_rules:
  source: s-up-mbchb-2027
  subjects_counted: 6        # six 20-credit subjects: the highest APS is 42
  life_orientation: exclude
  scale:
    - {min_percent: 80, level: 7}
    - {min_percent: 70, level: 6}
    - {min_percent: 60, level: 5}
    - {min_percent: 50, level: 4}
    - {min_percent: 40, level: 3}
    - {min_percent: 30, level: 2}
    - {min_percent: 0, level: 1}

# How to apply (agent draft, 10 Oct 2026). UP's own application pages refuse automated reading, so where to apply,
# the fee and the documents stay out until a person has read them (docs/OPEN_QUESTIONS.md). UP's general opening
# date and its 2028 dates aren't in the documents read.
applications:
  after:
    - text: "Health Sciences: in certain programmes UP considers only first-choice applicants; programmes that take second choices say so."
      source: s-up-mbchb-2027
    - text: "MBChB: UP considers you if MBChB is your first or second choice. Applications opened on 1 April 2026, and UP takes no late ones."
      source: s-up-mbchb-2027
    - text: "MBChB: a provisional offer on Grade 11 results is confirmed if your final Merit Point Score is no more than five points below your Grade 11 one and you still meet the minimums."
      source: s-up-mbchb-2027
  windows:
    - intake: 2027
      source: s-up-req-2027
      closes: 2026-06-30       # "The closing date for programmes in this faculty is 30 June": every faculty but one
      programme_closes:
        - closes: 2026-05-31   # Veterinary Science
          programmes: [bvsc, b_veterinary_nursing]

# Campuses, money dates and support from UP's InfoGuide 2026; calendar from UP's main dates for 2026
# (amended) and 2027. Agent draft, 10 Oct 2026: a person checks every value, and every crisis line, before release.
campuses:
  - {id: hatfield, name: "Hatfield",
     note: "Economic and Management Sciences; Engineering, Built Environment and IT; Humanities; Law; Natural and Agricultural Sciences; Theology and Religion",
     source: s-up-infoguide-2026}
  - {id: groenkloof, name: "Groenkloof", note: "Education", source: s-up-infoguide-2026}
  - {id: hillcrest, name: "Hillcrest", note: "TuksSport and the High Performance Centre", source: s-up-infoguide-2026}
  - {id: mamelodi, name: "Mamelodi", note: "Post-school mathematics and science programmes; community engagement",
     source: s-up-infoguide-2026}
  - {id: onderstepoort, name: "Onderstepoort", note: "Veterinary Science", source: s-up-infoguide-2026}
  - {id: prinshof, name: "Prinshof", note: "Health Sciences", source: s-up-infoguide-2026}
  - {id: gibs, name: "GIBS (Sandton, Johannesburg)", note: "Gordon Institute of Business Science",
     source: s-up-infoguide-2026}

