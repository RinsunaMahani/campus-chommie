# Places with their own page that states a price, read on 10 Oct 2026 (docs/research/cheap-things.md). `campuses`
# lists the campuses in the same city. Agent draft: a person checks each price before release.
cheap_things:
  - {name: "Pretoria National Botanical Garden", category: outdoors,
     cost_note: "Students R50 in peak season (September to March); adults R100; children 6 to 17 R30; under 6 free. The ticket page shows no off-peak prices.",
     campuses: [hatfield, groenkloof, hillcrest, mamelodi, onderstepoort, prinshof], source: s-sanbi-pnbg-tickets}
  - {name: "Freedom Park", category: heritage,
     cost_note: "Kids, students and scholars R60; adults R90; pensioners and people with disabilities R60. Tours at 09:00, 12:00 and 15:00.",
     campuses: [hatfield, groenkloof, hillcrest, mamelodi, onderstepoort, prinshof],
     address: "Corner Koch and 7th Avenue, Salvokop, Pretoria", hours: "Every day, 08:00-16:30",
     source: s-freedompark}
  - {name: "Voortrekker Monument", category: heritage,
     cost_note: "Students at a recognised university R130; adults R250; the grounds only, without the museum, R55 for adults; parking R20 a car. The page says tickets bought online cost less, without saying how much.",
     campuses: [hatfield, groenkloof, hillcrest, mamelodi, onderstepoort, prinshof],
     address: "Eeufees Road, Groenkloof, Pretoria", source: s-vtm-fees}
  - {name: "DITSONG National Museum of Natural History", category: museum,
     cost_note: "Adults R60 for a self-guided visit (no separate student price); children, learners and pensioners R40. Fees for 1 April 2026 to 31 March 2027.",
     campuses: [hatfield, groenkloof, hillcrest, mamelodi, onderstepoort, prinshof],
     address: "432 Paul Kruger Street, Pretoria CBD",
     hours: "Every day, 07:30-16:00; closed on Christmas Day, New Year's Day and Good Friday",
     source: s-ditsong-nh-fees}


