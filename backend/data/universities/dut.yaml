      min_points: 20
      subject_minimums: {english: 3}
      choices:
        - one_of:
            - subjects: {accounting: 3}
            - subjects: {mathematics: 3}
            - subjects: {mathematical_literacy: 4}
      extras:
        - "A one-year bridging course, taught at Ritson Campus (Durban)."
        - "It isn't funded by NSFAS: you pay the registration, tuition, study material and residence costs yourself."
    bridges_to:
      - to: dip_accounting
        guarantee: considered
        conditions: "Pass four subjects of the Accounting Bridging Course."
        source: s-dut-opportunities

