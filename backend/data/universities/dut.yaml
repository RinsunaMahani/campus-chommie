# Durban University of Technology (DUT)
#
# Agent draft, read on 13 Oct 2026 (docs/research/universities.md). DUT's site certificate had expired
# that day, so its 2027 study guide couldn't be opened then. It opened on 22 Oct 2026: the points rule below
# is from its page 8. Dates come from the Central Applications Office (CAO).
# Nobody has checked these values yet: release stays false until a person has compared every one with its
# source.

university: dut
name: Durban University of Technology
city: Durban and Pietermaritzburg
academic_year: 2027
institution_type: university_of_technology   # its official name, and its own page, say it is a university of technology
institution_type_source: s-dut-type
release: false
max_choices: null

# Study Opportunities 2027, page 8, "Points Calculation Tables": the NSC rating code for each mark, "calculated
# for the top six subjects, excluding Life Orientation since it is not a 20-credit subject". Agent draft,
# read on 22 Oct 2026: needs a person's check against the PDF.
points_rules:
  source: s-dut-opportunities
  subjects_counted: 6
  life_orientation: exclude
  scale:
    - {min_percent: 80, level: 7}
    - {min_percent: 70, level: 6}
    - {min_percent: 60, level: 5}
    - {min_percent: 50, level: 4}
    - {min_percent: 40, level: 3}
    - {min_percent: 30, level: 2}
    - {min_percent: 0, level: 1}

applications:
  source: s-cao-faq
  url: https://www.cao.ac.za/
  how: "Apply through the Central Applications Office (CAO), at cao.ac.za."
  fee_cents: 25000
  fee_note: "The CAO's fee: R250 if it reaches the CAO by 31 October 2026, R470 from 1 November."
  windows:
    - intake: 2027
      source: s-cao-changes
      opens: null
      closes_one_of: [2026-08-31, 2026-09-30]
      note: "Each DUT programme has its own closing date on the CAO's list: Diagnostic Radiography closed on 31 August 2026, Medical Laboratory Science on 30 September."

# Campuses from the university's own page (s-dut-opportunities), read on 22 Oct 2026. Agent draft.
campuses:
  - {id: steve_biko, name: "Steve Biko (Durban)", source: s-dut-opportunities}
  - {id: ritson, name: "Ritson (Durban)", source: s-dut-opportunities}
  - {id: ml_sultan, name: "M.L. Sultan (Durban)", source: s-dut-opportunities}
  - {id: city, name: "City (Durban)", source: s-dut-opportunities}
  - {id: brickfield, name: "Brickfield (Durban)", source: s-dut-opportunities}
  - {id: indumiso, name: "Indumiso (Pietermaritzburg)", note: "One of DUT's two Midlands campuses.", source: s-dut-opportunities}
  - {id: riverside, name: "Riverside (Pietermaritzburg)", note: "One of DUT's two Midlands campuses.", source: s-dut-opportunities}

# Programmes from Study Opportunities 2027 (s-dut-opportunities), read on 22 Oct 2026: the NSC column of each
# programme's "Entry Requirements" table only (the Senior Certificate and NC(V) columns are left out). Page numbers
# in comments are the guide's printed ones. "English Home Language 3 OR First Additional 4" becomes english: 3 with
# the full rule in extras; "recognised NSC 20-credit subjects" become additional_minimums. Where DUT gives no
# points minimum, min_points is null and only the subjects are checked. Agent draft: docs/research/dut.md lists
# every choice made. Nobody has checked these values yet.
programmes:

