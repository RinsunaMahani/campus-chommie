university: dut
name: Durban University of Technology
city: Durban and Pietermaritzburg
academic_year: 2027
institution_type: university_of_technology   # its official name, and its own page, say it is a university of technology
institution_type_source: s-dut-type
release: false
max_choices: null

# Study Opportunities 2027, page 8, "Points Calculation Tables": the NSC rating code for each mark, "calculated
# for the top six subjects, excluding Life Orientation since it is not a 20-credit subject". Agent draft,
# read on 22 Oct 2026: needs a person's check against the PDF.
points_rules:
  source: s-dut-opportunities
  subjects_counted: 6
  life_orientation: exclude
  scale:
    - {min_percent: 80, level: 7}
    - {min_percent: 70, level: 6}
    - {min_percent: 60, level: 5}
    - {min_percent: 50, level: 4}
    - {min_percent: 40, level: 3}
    - {min_percent: 30, level: 2}
    - {min_percent: 0, level: 1}

applications:
  source: s-cao-faq
  url: https://www.cao.ac.za/
  how: "Apply through the Central Applications Office (CAO), at cao.ac.za."
  fee_cents: 25000
  fee_note: "The CAO's fee: R250 if it reaches the CAO by 31 October 2026, R470 from 1 November."
  windows:
    - intake: 2027
      source: s-cao-changes
      opens: null
      closes_one_of: [2026-08-31, 2026-09-30]
      note: "Each DUT programme has its own closing date on the CAO's list: Diagnostic Radiography closed on 31 August 2026, Medical Laboratory Science on 30 September."

