        - "A good pass in Mathematics or a quantitative subject (CUT names Physics and Accounting) is an advantage."
        - "Full-time only. Campuses: Bloemfontein and Welkom."

  - id: dip_marketing_management
    name: "Diploma in Marketing Management"
    faculty: "Faculty of Management Sciences"
    fields: [management, commerce]
    selective: true
    selection_note: "Candidates may be asked to write a selection test."
    requirements:
      source: s-cut-prog-dip-marketing
      min_points: 27
      subject_minimums: {english: 4}
      extras:
        - "Mathematics, Accounting and other commercial subjects are highly recommended."
        - "Day classes only. Campuses: Bloemfontein and Welkom (the International direction only in Bloemfontein)."

  - id: dip_office_management_technology
    name: "Diploma in Office Management and Technology"
    faculty: "Faculty of Management Sciences"
    fields: [management]
    requirements:
      source: s-cut-prog-dip-omt
      min_points: 27
      subject_minimums: {english: 4}
      extras:
        - "CUT says only candidates with 27 points or more are eligible for selection."
        - "Full-time only. Campuses: Bloemfontein and Welkom."

  - id: bms_accountancy
    name: "Bachelor of Management Sciences in Accountancy"
    faculty: "Faculty of Management Sciences"
    fields: [accounting]
    selective: true
    selection_note: "Selection tests, which may include psychometric testing, may be required."
    requirements:
      source: s-cut-prog-bms-accountancy
      min_points: 27
      subject_minimums: {accounting: 5, english: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 3}
            - subjects: {mathematical_literacy: 5}
      extras:
        - "CUT asks for an NSC with a bachelor's pass (its page says \"degree exemption\") and calls the points minimum an M-score of 27."
        - "If you narrowly miss, CUT may consider you for the five-year extended (ECP) stream: 27 points, Accounting 50%, Mathematical Literacy 50% or Mathematics 30%, and English 50%."
        - "You need a laptop that meets the department's specifications."
        - "Campuses: Bloemfontein and Welkom."

  - id: bms_internal_auditing
    name: "Bachelor of Management Sciences in Internal Auditing"
    faculty: "Faculty of Management Sciences"
    fields: [accounting, finance]
    selective: true
    selection_note: "Selection tests, which may include psychometric testing, may be required."
    requirements:
      source: s-cut-prog-bms-auditing
      min_points: 27
      subject_minimums: {accounting: 5, english: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 3}
            - subjects: {mathematical_literacy: 5}
      extras:
        - "CUT asks for an NSC with a bachelor's pass (its page says \"degree exemption\") and calls the points minimum an M-score of 27."
        - "If you narrowly miss, CUT may consider you for the five-year extended (ECP) stream: 27 points, Accounting 50%, Mathematical Literacy 50% or Mathematics 30%, and English 50%."
        - "You need a laptop that meets the department's specifications."
        - "Campus: Bloemfontein."

