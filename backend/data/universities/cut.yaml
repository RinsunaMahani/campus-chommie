# Central University of Technology (CUT)
#
# Agent draft, read on 13 Oct 2026 (docs/research/universities.md). CUT's points table doesn't say how
# many subjects count, so there's no points rule yet. Nobody has checked these values yet: release stays
# false until a person has compared every one with its source.
#
# The 42 programmes (agent draft, 15 Oct 2026) come from CUT's own programme pages on www.cut.ac.za, one
# source per page; docs/research/cut.md says what was read, what was blocked and what to check first.

university: cut
name: Central University of Technology
city: Bloemfontein and Welkom
academic_year: 2027
province: Free State
province_source: s-cut-where
institution_type: university_of_technology   # its official name, and its own page, say it is a university of technology
institution_type_source: s-cut-where
release: false
max_choices: 2

points_rules: null
points_note: "CUT's points table doesn't say how many subjects count."
# From CUT's Admission points (AP) page, read on 22 Oct 2026. Agent draft.
points_how:
  source: s-cut-ap
  text: "CUT's scale gives 2 to 8 points a subject (30-39% is 2, up to 90-100% is 8), and Life Orientation counts 1 at most. You need 27 to be admitted; 22 to 26 means a selection test. CUT doesn't say how many subjects count, so work yours out on CUT's own course calculator."
  link: "https://www.cut.ac.za/Course-calculator"

applications:
  source: s-cut-apply
  url: https://www.cut.ac.za/application-process/
  how: "Apply online, with a first and a second programme choice."
  fee_cents: 0
  windows:
    - intake: 2027
      source: s-cut-faq
      opens: null
      closes: 2026-09-30
      no_late_applications: true
      note: "Applications opened in April 2026. Some programmes closed earlier when they had many applications."

# Campuses from the university's own page (s-cut-campuses), read on 22 Oct 2026. Agent draft.
campuses:
  - {id: bloemfontein, name: "Bloemfontein", source: s-cut-campuses}
  - {id: welkom, name: "Welkom", source: s-cut-campuses}

