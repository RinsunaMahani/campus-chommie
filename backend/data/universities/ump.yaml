# University of Mpumalanga (UMP)
#
# Agent draft, from UMP's own pages read on 13 Oct 2026 (docs/research/universities.md). Nobody has
# checked these values yet: release stays false until a person has compared every one with its source.
# Programmes: all 24 undergraduate first qualifications UMP lists, each citing its own programme page (read
# 14 Oct 2026; the pages give no year), except the Bachelor of Social Sciences, which has no published requirements.

university: ump
name: University of Mpumalanga
city: Mbombela
academic_year: 2027
release: false
max_choices: 2                 # "maximum of two choices"

points_rules:
  source: s-ump-aps
  subjects_counted: 7          # "the prescribed seven subjects"
  life_orientation: half       # "divided by 2"
  note: "UMP always counts your two languages, Mathematics or Mathematical Literacy, and Life Orientation, then your three best other subjects. We count your best six besides Life Orientation, which is the same when you take seven subjects."
  scale:
    - {min_percent: 80, level: 7}
    - {min_percent: 70, level: 6}
    - {min_percent: 60, level: 5}
    - {min_percent: 50, level: 4}
    - {min_percent: 40, level: 3}
    - {min_percent: 30, level: 2}
    - {min_percent: 0, level: 1}

applications:
  source: s-ump-apply
  url: https://www.ump.ac.za/Study-with-us/Application-Process/Online-Applications
  how: "Apply online, and upload proof of the application fee with your application."
  fee_cents: 20000
  fee_note: "Not refunded."
  windows:
    - intake: 2027
      source: s-ump-apply
      opens: 2026-06-01
      closes: 2026-11-30

# Programmes, agent draft of 14 Oct 2026: requirements come from each programme's own page (s-ump-*). The pages give no
# year, and some differ from UMP's older programmes leaflet (s-ump-ug-leaflet, made Oct 2023): the pages are newer, so
# they win, and docs/research/ump.md lists every difference. No programme adds a test, interview or portfolio. Left
# out: the old Diploma in Hospitality Management (phased out after 2023, for returning students only), advanced
# diplomas and postgraduate programmes.
programmes:

  # Faculty of Agriculture and Natural Sciences: School of Agricultural Sciences
  - id: dip_plant_production
    name: "Diploma in Agriculture in Plant Production"
    fields: [agriculture]
    requirements:
      source: s-ump-dip-plant-production
      min_points: 23
      subject_minimums: {english: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 3}
            - subjects: {mathematical_literacy: 4}
              min_points: 24
        - one_of:                    # "Agriculture or Geography or Life Science: Level 4"
            - subjects: {agricultural_sciences: 4}
            - subjects: {geography: 4}
            - subjects: {life_sciences: 4}

  - id: dip_animal_production
    name: "Diploma in Animal Production"
    fields: [agriculture]
    requirements:
      source: s-ump-dip-animal-production
      min_points: 24
      subject_minimums: {english: 4, physical_sciences: 3}
      choices:
        - one_of:
            - subjects: {mathematics: 3}
            - subjects: {mathematical_literacy: 6}
              min_points: 27
        - one_of:                    # "Life Sciences or Agriculture: Level 4"
            - subjects: {life_sciences: 4}
            - subjects: {agricultural_sciences: 4}

  - id: bagric_extension
    name: "Bachelor of Agriculture in Agricultural Extension and Rural Resource Management"
    fields: [agriculture]
    requirements:
      source: s-ump-bagric-extension
      min_points: 26
      subject_minimums: {english: 4, life_orientation: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 4}
            # The page gives 28 points with Mathematical Literacy but no level: level 6 is from s-ump-ug-leaflet p6.
            - subjects: {mathematical_literacy: 6}
              min_points: 28
        - one_of:                    # "(Physical or Life or Agricultural Sciences) level 4"
            - subjects: {physical_sciences: 4}
            - subjects: {life_sciences: 4}
            - subjects: {agricultural_sciences: 4}
      extras:
        - "With Mathematical Literacy you need 28 points. UMP's page doesn't give the Mathematical Literacy level: level 6 is from UMP's older programmes leaflet."

  - id: bsc_agriculture
    name: "Bachelor of Science in Agriculture"
    fields: [agriculture]
    requirements:
      source: s-ump-bsc-agriculture
      min_points: 32
      subject_minimums: {english: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 4}
            - subjects: {mathematical_literacy: 6}
        - one_of:                    # "Two of Physical, Life, Agricultural Sciences of Geography at level 4"
            - subjects: {physical_sciences: 4, life_sciences: 4}
            - subjects: {physical_sciences: 4, agricultural_sciences: 4}
            - subjects: {physical_sciences: 4, geography: 4}
            - subjects: {life_sciences: 4, agricultural_sciences: 4}
            - subjects: {life_sciences: 4, geography: 4}
            - subjects: {agricultural_sciences: 4, geography: 4}
      extras:
        - "With Mathematical Literacy (level 6 or more) UMP will consider you, but you may need to take a supporting mathematics module."

  - id: bsc_forestry
    name: "Bachelor of Science in Forestry"
    fields: [agriculture]
    requirements:
      source: s-ump-bsc-forestry
      min_points: 30
      subject_minimums: {english: 4, mathematics: 4, physical_sciences: 4}
      choices:
        - one_of:                    # "Two subjects from Life Science, Agricultural Science or Geography at level 4"
            - subjects: {life_sciences: 4, agricultural_sciences: 4}
            - subjects: {life_sciences: 4, geography: 4}
            - subjects: {agricultural_sciences: 4, geography: 4}

  # School of Biology and Environmental Sciences
  - id: dip_nature_conservation
    name: "Diploma in Nature Conservation"
    fields: [natural_sciences, life_sciences]
    requirements:
      source: s-ump-dip-nature-conservation
      min_points: 28
      subject_minimums: {english: 4, life_sciences: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 2}
            - subjects: {mathematical_literacy: 4}

  - id: bsc
    name: "Bachelor of Science"
    fields: [natural_sciences, life_sciences, earth_sciences]
    requirements:
      source: s-ump-bsc
      min_points: 30
      subject_minimums: {english: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 4}
            - subjects: {mathematical_literacy: 6}
        - one_of:                    # "level 4 for two of Life Science, Physical Science or Geography"
            - subjects: {life_sciences: 4, physical_sciences: 4}
            - subjects: {life_sciences: 4, geography: 4}
            - subjects: {physical_sciences: 4, geography: 4}

  - id: bsc_environmental_science
    name: "Bachelor of Science in Environmental Science"
    fields: [natural_sciences, earth_sciences]
    requirements:
      source: s-ump-bsc-environmental
      min_points: 30
      subject_minimums: {english: 4, geography: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 4}
            - subjects: {mathematical_literacy: 6}
        - one_of:                    # "plus Level 4 in either Life Sciences or Physical Sciences"
            - subjects: {life_sciences: 4}
            - subjects: {physical_sciences: 4}

  # School of Computing and Mathematical Sciences
  - id: hcert_ict_user_support
    name: "Higher Certificate in Information Communication Technology in User Support"
    fields: [computing]
    requirements:
      source: s-ump-hcert-ict
      min_points: 20
      subject_minimums: {english: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 2}
            - subjects: {mathematical_literacy: 4}
              min_points: 22
      additional_minimums: [2, 2, 2]   # "at least 2 (30 – 39%) for any other 3 content subjects"

  - id: dip_ict_applications_development
    name: "Diploma in ICT in Applications Development"
    fields: [computing]
    requirements:
      source: s-ump-dip-ict
      min_points: 24
      subject_minimums: {english: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 3}
            - subjects: {technical_mathematics: 3}
            - subjects: {mathematical_literacy: 6}
      extras:
        - "UMP's page asks for English Home Language at level 4: if you take English as a first additional language, check with UMP."

  - id: bict
    name: "Bachelor of Information and Communication Technology"
    fields: [computing]
    requirements:
      source: s-ump-bict
      min_points: 32
      subject_minimums: {english: 4, mathematics: 4}

  # Faculty of Economics, Development and Business Sciences: School of Development Studies
  - id: badmin
    name: "Bachelor of Administration"
    fields: [public_administration]
    requirements:
      source: s-ump-badmin
      min_points: 32
      subject_minimums: {english: 4, other_language: 4}   # "Second language: Level 4"
      choices:
        - one_of:
            - subjects: {mathematics: 2}
            - subjects: {mathematical_literacy: 3}
      extras:
        - "To take Economics as an elective you need Mathematics at level 4."

  - id: bcom
    name: "Bachelor of Commerce (General)"
    fields: [commerce]
    requirements:
      source: s-ump-bcom
      min_points: 30
      subject_minimums: {english: 4, mathematics: 4}
      extras:
        - "Mathematical Literacy isn't accepted."

  - id: bdev_studies
    name: "Bachelor of Development Studies"
    fields: [humanities, economics]
    requirements:
      source: s-ump-bdev
      min_points: 32
      subject_minimums: {english: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 2}
            - subjects: {mathematical_literacy: 3}
        - one_of:                    # "Geography/History and One Other Social or Commercial Sciences Subject at level 4"
            - subjects: {geography: 4}
            - subjects: {history: 4}
      extras:
        - "You also need one other social or commercial sciences subject at level 4."

  - id: llb
    name: "Bachelor of Laws"
    fields: [law]
    requirements:
      source: s-ump-llb
      min_points: 33
      subject_minimums: {english: 4, other_language: 4}   # "Additional Language at level 4"
      choices:
        - one_of:
            - subjects: {mathematics: 3}
            - subjects: {mathematical_literacy: 4}
      extras:
        - "UMP selects every month: applicants above the minimum who have finished matric get conditional offers, and those who just meet it are put on hold and considered again each month."
        - "At least half the places are kept for applicants still finishing matric."

  - id: dip_entrepreneurship
    name: "Diploma in Entrepreneurship"
    fields: [management, commerce]
    requirements:
      source: s-ump-dip-entrepreneurship
      min_points: 22
      subject_minimums: {english: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 3}
            - subjects: {mathematical_literacy: 5}
              min_points: 26
        - one_of:                    # "any of the commerce subjects, such as Business Studies, Economics, Accounting, Tourism, among others"
            - subjects: {business_studies: 4}
            - subjects: {economics: 4}
            - subjects: {accounting: 4}
            - subjects: {tourism: 4}
      extras:
        - "UMP asks for level 4 in a commerce subject, naming Business Studies, Economics, Accounting and Tourism \"among others\"."

  # School of Hospitality and Tourism Management
  - id: hcert_event_management
    name: "Higher Certificate in Event Management"
    fields: [tourism_and_hospitality, management]
    requirements:
      source: s-ump-hcert-events
      min_points: 19
      subject_minimums: {english: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 2}
            - subjects: {mathematical_literacy: 4}
              min_points: 21
            # The page names Technical Mathematics without a level: level 4 is from s-ump-ug-leaflet p2.
            - subjects: {technical_mathematics: 4}
              min_points: 21
      additional_minimums: [2, 2, 2]
      extras:
        - "UMP's page asks for \"any three additional vocational subjects\" at level 2."
        - "UMP's page doesn't give the Technical Mathematics level: level 4 is from UMP's older programmes leaflet."

  - id: dip_hospitality_management
    name: "Diploma in Hospitality Management"
    fields: [tourism_and_hospitality, management]
    requirements:
      source: s-ump-dip-hospitality   # the Revised Curriculum page: new students since 2024
      min_points: 26
      subject_minimums: {english: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 3}
            - subjects: {mathematical_literacy: 4}
              min_points: 27
      extras:
        - "This diploma's page repeats the Diploma in Culinary Arts' rule (26 points, or 27 with Mathematical Literacy); UMP's older leaflet said 24, or 25 with Mathematical Literacy. Check with UMP."
        - "UMP's page asks for English Home Language at level 4: if you take English as a first additional language, check with UMP."

  - id: dip_culinary_arts
    name: "Diploma in Culinary Arts"
    fields: [tourism_and_hospitality, food_science]
    requirements:
      source: s-ump-dip-culinary
      min_points: 26
      subject_minimums: {english: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 3}
            - subjects: {mathematical_literacy: 4}
              min_points: 27
      extras:
        - "UMP's page asks for English Home Language at level 4: if you take English as a first additional language, check with UMP."

  # School of Social Sciences
  - id: ba
    name: "Bachelor of Arts (General)"
    fields: [humanities]
    requirements:
      source: s-ump-ba
      min_points: 28
      subject_minimums: {english: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 2}
            - subjects: {mathematical_literacy: 3}

  - id: ba_media_communication_culture
    name: "Bachelor of Arts in Media, Communication and Culture"
    fields: [humanities, languages_and_communication]
    requirements:
      source: s-ump-ba-media
      min_points: 32
      subject_minimums: {english: 4, other_language: 4}   # "Second language on level 4"
      choices:
        - one_of:
            - subjects: {mathematics: 2}
            - subjects: {mathematical_literacy: 3}

  - id: bsw
    name: "Bachelor of Social Work"
    fields: [humanities]
    requirements:
      source: s-ump-bsw
      min_points: 32
      subject_minimums: {english: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 2}
            - subjects: {mathematical_literacy: 3}
      extras:
        - "You need a police clearance certificate, or proof that you've applied for one."

  # In UMP's 2026 Fees Handbook (s-ump-fees-2026 p15, first year only), but with no programme page or requirements.
  - id: bsocsci
    name: "Bachelor of Social Sciences"
    fields: [humanities]
    requirements: null

  # Faculty of Education: School of Early Childhood Education
  - id: bed_foundation_phase
    name: "Bachelor of Education in Foundation Phase Teaching"
    fields: [education]
    requirements:
      source: s-ump-aps
      min_points: 26
      # Group A: language of teaching and learning 5, another recognised language 4, Mathematics 3 or Mathematical
      # Literacy 4, Life Orientation 4. Group B: three more subjects at 4.
      subject_minimums: {english: 5, other_language: 4, life_orientation: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 3}
            - subjects: {mathematical_literacy: 4}
              min_points: 27
      additional_minimums: [4, 4, 4]
      extras:
        - "UMP asks for its language of teaching and learning at level 5 (we check English) and another recognised language at level 4."
        - "UMP admits you provisionally on your final Grade 11 results; final admission rests on your final Grade 12 results."

