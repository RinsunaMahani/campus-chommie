    faculty: "Faculty of Health Sciences"
    fields: [health_sciences, sport_science]
    selective: true
    selection_note: &wits_ci "Wits ranks applicants by a Composite Index: 75% is the average of your percentages in English, Mathematics, the better of Physical Sciences or Life Sciences, and your best two other subjects; 25% is your National Benchmark Test (NBT) scores."
    requirements:
      source: s-wits-health-biokinetics
      min_points: null
      subject_minimums: {english: 5, mathematics: 5}
      choices:
        - one_of:
            - subjects: {life_sciences: 5}
            - subjects: {physical_sciences: 5}
      extras:
        - &wits_nbt "Write the NBT in person (pen and paper): online results aren't considered, and only your first attempt in the most recent year counts. Wits's programme page says by 17 August; its additional-requirements page says 15 August."

