  url: https://www.wits.ac.za/undergraduate/apply-to-wits/
  how: "Apply online, then upload documents and follow your application on the Wits self-service portal."
  fee_cents: 10000
  windows:
    - intake: 2027
      source: s-wits-timelines
      opens: null                # "March: Applications open", without a day
      closes: 2026-09-30
      note: "Applications opened in March 2026. Every Health Sciences programme closed on 30 June 2026, as did Architectural Studies, Audiology, Speech-Language Pathology and BA Film and TV."

