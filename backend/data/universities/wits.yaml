# University of the Witwatersrand (Wits)
#
# Agent draft, from Wits's own pages read on 13 Oct 2026 (docs/research/universities.md). Nobody has
# checked these values yet: release stays false until a person has compared every one with its source.
#
# The 85 programmes (agent draft, 14 Oct 2026) come from Wits's own course-finder pages for the 2027 intake, one
# source per page; docs/research/wits.md says what was read, what was left out and what to check first.

university: wits
name: University of the Witwatersrand
city: Johannesburg
academic_year: 2027
release: false
max_choices: null

points_rules:
  source: s-wits-entry
  subjects_counted: 7          # "the best seven subjects including Life Orientation"
  life_orientation: full       # counted, on its own smaller table below
  count_from_level: 3          # under 40% adds nothing
  note: "Wits counts any subject a faculty requires, even when it isn't among your best seven."
  scale:
    - {min_percent: 90, level: 8}
    - {min_percent: 80, level: 7}
    - {min_percent: 70, level: 6}
    - {min_percent: 60, level: 5}
    - {min_percent: 50, level: 4}
    - {min_percent: 40, level: 3}
    - {min_percent: 30, level: 2}
    - {min_percent: 0, level: 1}
  subject_points:              # English and Mathematics add 2 from 60%; Life Orientation tops out at 4
    english:
      - {min_percent: 90, points: 10}
      - {min_percent: 80, points: 9}
      - {min_percent: 70, points: 8}
      - {min_percent: 60, points: 7}
      - {min_percent: 50, points: 4}
      - {min_percent: 40, points: 3}
      - {min_percent: 0, points: 0}
    mathematics:
      - {min_percent: 90, points: 10}
      - {min_percent: 80, points: 9}
      - {min_percent: 70, points: 8}
      - {min_percent: 60, points: 7}
      - {min_percent: 50, points: 4}
      - {min_percent: 40, points: 3}
      - {min_percent: 0, points: 0}
    life_orientation:
      - {min_percent: 90, points: 4}
      - {min_percent: 80, points: 3}
      - {min_percent: 70, points: 2}
      - {min_percent: 60, points: 1}
      - {min_percent: 0, points: 0}

applications:
  source: s-wits-apply
  url: https://www.wits.ac.za/undergraduate/apply-to-wits/
  how: "Apply online, then upload documents and follow your application on the Wits self-service portal."
  fee_cents: 10000
  windows:
    - intake: 2027
      source: s-wits-timelines
      opens: null                # "March: Applications open", without a day
      closes: 2026-09-30
      note: "Applications opened in March 2026. Every Health Sciences programme closed on 30 June 2026, as did Architectural Studies, Audiology, Speech-Language Pathology and BA Film and TV."

# Every programme below comes from its own page in Wits's course finder (read 14 Oct 2026), which gives the 2027
