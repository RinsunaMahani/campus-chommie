# North-West University (NWU)
#
# Agent draft, from NWU's Grade 12 Prospectus read on 14 Oct 2026 (docs/research/nwu.md).
# Nobody has checked these values yet: release stays false until a person has compared every
# one with its source. All undergraduate programmes take their requirements from the prospectus.

university: nwu
name: North-West University
city: Potchefstroom, Mahikeng and Vanderbijlpark
academic_year: 2027
release: false
max_choices: null

points_rules:
  source: s-nwu-prospectus
  subjects_counted: 6
  life_orientation: exclude
  note: "NWU counts the best six subjects excluding Life Orientation. Most faculties recommend at least 60% in Life Orientation."
  scale:
    - {min_percent: 90, level: 8}
    - {min_percent: 80, level: 7}
    - {min_percent: 70, level: 6}
    - {min_percent: 60, level: 5}
    - {min_percent: 50, level: 4}
    - {min_percent: 40, level: 3}
    - {min_percent: 30, level: 2}
    - {min_percent: 0, level: 1}

applications:
  source: s-nwu-apply
  url: https://studies.nwu.ac.za/studies/apply
  how: "Apply online on NWU's application portal before the closing date."
  fee_cents: 15000
  fee_note: "Paid online before you submit. Not refunded."
  documents:
    source: s-nwu-prospectus
    items:
      - "Certified copy of ID document or passport"
      - "Certified copy of Grade 11 final stamped results or statement of Grade 12 results / National Senior Certificate"
      - "Academic record and certificate of good conduct (if transferring from another university)"
      - "Proof of USAf evaluation certificate (for international qualifications)"
  after:
    - text: "Meeting the minimum APS and subject requirements does not guarantee admission as programme capacity is limited."
      source: s-nwu-prospectus
    - text: "Programmes with selection criteria (e.g. Nursing, Pharmacy, Graphic Design, Music) require additional screening and closed early."
      source: s-nwu-prospectus
  windows:
    - intake: 2027
      source: s-nwu-apply
      opens: 2026-06-01
      closes: 2026-08-31
      programme_closes:
        - closes: 2026-06-30
          programmes: [bpharm, bnurs, bsc_dietetics, b_biokinetics, bsw, ba_graphic_design, bmus]
          source: s-nwu-apply
      note: "Programmes with selection closed on 30 June 2026. General undergraduate applications closed on 31 August 2026."

