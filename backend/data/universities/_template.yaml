# Template for a new university. Copy it to <university-id>.yaml (for example up.yaml).
#
# Rules:
# - Fill it from OFFICIAL sources only: prospectus, admissions pages, rule books.
# - Every fact cites a source id from the sources list at the bottom.
# - Leave a field out, or set it to null, rather than guess.
# - Keep release: false until a second person has checked every value.
# - Files starting with "_" are skipped by the app, so this template never shows up.
# - Subject keys come from SUBJECTS in campus_engine/schemas.py; an unknown key fails validation.
# - Fields link related programmes: the plan's safer third choice is the closest programme by
#   the share of fields it has in common with the goal. Reuse the fields already in the packs:
#   health_sciences, medicine, medical_sciences, dentistry, nursing, pharmacy, radiography,
#   rehabilitation, nutrition, emergency_care, environmental_health, sport_science,
#   natural_sciences, life_sciences, physical_sciences, earth_sciences, mathematical_sciences,
#   agriculture, food_science, veterinary, engineering, built_environment, computing, commerce,
#   accounting, finance, economics, management, public_administration, law, safety_and_justice,
#   education, humanities, languages_and_communication, arts_and_design, performing_arts, music,
#   theology, tourism_and_hospitality, consumer_sciences.

university: example          # short lowercase id, e.g. up, tut
name: Example University
city: Pretoria
academic_year: 2027          # the intake these rules apply to
release: false
max_choices: null            # how many programmes one application may list

points_rules:
  source: s-prospectus
  subjects_counted: 6        # how many subjects count towards the points score
  life_orientation: exclude  # full | half | exclude
  count_from_level: 1        # subjects below this level add no points (TUT counts from 2)
  scale:                     # replace with the university's own table if it differs
    - {min_percent: 80, level: 7}
    - {min_percent: 70, level: 6}
    - {min_percent: 60, level: 5}
    - {min_percent: 50, level: 4}
    - {min_percent: 40, level: 3}
    - {min_percent: 30, level: 2}
    - {min_percent: 0, level: 1}

applications:                # how to apply; leave out anything not published (the app says "not verified yet")
  source: s-apply            # cites url, how, fee and contact
  url: https://example.org/apply   # the university's own page about applying (https only)
  how: "Apply online, with an email address of your own."
  fee_cents: 25000           # integer cents: R250
  fee_note: "Not refundable."
  contact: "012 000 0000, admissions@example.org"
  documents:
    source: s-apply
    items:
      - "A certified copy of your ID"
  after:                     # what happens after you apply, each line with its source
    - {text: "Check your status online with your ID number.", source: s-apply}
  windows:                   # one per intake: the year a learner would start
    - intake: 2027
      source: s-apply
      opens: 2026-04-01
      closes: 2026-09-30     # the usual closing date
      closing_time: null     # SAST, quoted, e.g. "23:59"
      programme_closes:      # programmes with their own closing date
        - {closes: 2026-06-15, programmes: [example-programme]}
      closes_one_of: []      # closing dates named without saying which programme closes when
      late: null             # {opens, closes, note, source} when late applications are published
      no_late_applications: false   # true only when the university says so
    # an intake with no window is shown as "not published yet"
  accepting: {text: "Pay the confirmation fee within three days of the offer letter.", source: s-apply}

campuses:
  - {id: main, name: "Main campus", note: "Which faculties it houses", source: s-calendar}

calendar:                    # term | registration | orientation | test_week | revision | exam | recess | results
                             # | deadline | graduation | closed
  - {period: registration, name: "First-year registration", start: 2027-01-18, end: 2027-01-29, who: first_years,
     step: register, source: s-calendar}        # step: register | orientation | first_lecture (first steps)
  - {period: deadline, name: "Last day to cancel modules without paying for them", start: 2027-02-26,
     campuses: [main], source: s-calendar}     # campuses: empty means every campus

funding_cycles:              # dates only, never amounts; the key is "when" because YAML reads "on" as true
  - {funder: university, kind: fee_due, name: "First tuition instalment due", when: 2027-03-31, source: s-calendar}

support_services:            # counselling | crisis | financial_aid | food_support | tutoring | chaplaincy | health
                             # | careers | disability; a person verifies every crisis line before release
  - {kind: counselling, name: "Student counselling", contact: "012 000 0000", hours: "08:00-16:00", source: s-calendar}

cheap_things: []             # [{name, category, cost_note, campuses, address, hours, source}]: the price as its own page states it

programmes:
  - id: example-programme
    name: Example programme
    fields: [commerce]       # tags from FIELDS in campus_engine/schemas.py: they link related programmes for
                             # the safe-choice slot, and funders of those fields
    selective: false
    faculty: "Faculty of Commerce"   # the university's own name, from its source; leave out if none says
    requirements:
      source: s-prospectus
      min_points: 30           # null only when the university publishes no points minimum for this programme
      subject_minimums: {english: 4, mathematics: 4}
      additional_minimums: []
    bridges_to: []           # published routes into other programmes, with guarantee by_rule or considered

  - id: example-either-or
    name: Example programme with an either/or subject
    fields: [commerce]
    requirements:
      source: s-prospectus
      min_points: 26
      subject_minimums: {english: 4}
      subject_min_percents: {}   # percentages instead of levels, for example {english: 65}
      choices:                   # the learner meets one option in every choice
        - one_of:
            - subjects: {mathematics: 5}
            - subjects: {technical_mathematics: 5}
            - subjects: {mathematical_literacy: 7}
              min_points: 28     # this route needs more points
    points_rules: null           # set only when this programme counts points its own way

sources:
  - id: s-prospectus
    url: https://example.org/prospectus
    publisher: Example University
    title: Undergraduate prospectus
    retrieved: 2026-10-01
    last_verified: 2026-10-01
    verified_by: Name of the person who checked it
  - id: s-calendar
    url: https://example.org/calendar
    publisher: Example University
    title: Academic calendar
    retrieved: 2026-10-01
    last_verified: 2026-10-01
    verified_by: Name of the person who checked it
  - id: s-apply
    url: https://example.org/apply
    publisher: Example University
    title: How to apply
    retrieved: 2026-10-01
    last_verified: 2026-10-01
    verified_by: Name of the person who checked it
