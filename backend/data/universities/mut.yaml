# Mangosuthu University of Technology (MUT)
#
# Agent draft, read on 13 Oct 2026 (docs/research/universities.md). The points rule is the one on MUT's
# admission page (the best five subjects), added on 14 Oct 2026. Nobody has checked these values yet: release
# stays false until a person has compared every one with its source. The 40 programmes come from the CAO's
# 2027 handbook, checked against MUT's 2026 faculty handbooks and its prospectus (docs/research/mut.md).

university: mut
name: Mangosuthu University of Technology
city: Umlazi, Durban
academic_year: 2027
release: false
max_choices: null

# MUT's own rule, from its admission page. MUT's other documents, and the CAO's default, count six subjects:
# the first thing to check (docs/research/mut.md). The two IT diplomas say six in so many words, so they
# carry their own rule.
points_rules:
  source: s-mut-admission
  subjects_counted: 5          # "calculated from the best five subjects presented by the prospective student"
  life_orientation: exclude    # not on that page; MUT's handbooks, its rule G.14 and the CAO leave it out
  count_from_level: 3          # MUT's matrix starts at 40-49% = 3 points: nothing under 40%
  note: "MUT's admission page counts your best five subjects; we leave out Life Orientation, as MUT's handbooks do. The CAO's handbook counts six subjects by default, so check with MUT."
  scale:                       # MUT's matrix: 90-100% = 8 points down to 40-49% = 3; levels 1 and 2 are the NSC's own
    - {min_percent: 90, level: 8}
    - {min_percent: 80, level: 7}
    - {min_percent: 70, level: 6}
    - {min_percent: 60, level: 5}
    - {min_percent: 50, level: 4}
    - {min_percent: 40, level: 3}
    - {min_percent: 30, level: 2}
    - {min_percent: 0, level: 1}

applications:
  source: s-mut-apply
  url: https://www.mut.ac.za/prospective-students/apply/
  how: "Apply through the Central Applications Office (CAO): one application and one fee for more than one programme. MUT considers applicants who put it first or second."
  fee_cents: 25000
  fee_note: "The CAO's fee: R250 if it reaches the CAO by 31 October 2026, R470 from 1 November."
  windows:
    - intake: 2027
      source: s-mut-apply
      opens: null
      closes: 2026-11-30
      note: "Applications opened in January 2026 and closed on 30 September; MUT accepts late applications until 30 November, at the CAO's late fee."

# Requirements from the CAO's 2027 handbook (MUT's rows), which its 2026 faculty handbooks repeat, unless a
# programme says otherwise. Where the CAO gives no points, the faculty handbook's minimum is used; where neither
# gives one, min_points is null (MUT publishes none, so only the subjects are checked) and extras say so. Agent draft, 14 Oct 2026.
