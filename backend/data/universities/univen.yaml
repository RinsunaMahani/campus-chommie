# University of Venda (UNIVEN)
#
# Agent draft, from UNIVEN's 2027 undergraduate prospectus (read on 13 and 14 Oct 2026;
# docs/research/univen.md). Nobody has checked these values yet: release stays false until
# a person has compared every one with its source. All 80 undergraduate programmes take
# their requirements from the 2027 prospectus (pages 13 to 25).

university: univen
name: University of Venda
city: Thohoyandou
academic_year: 2027
release: false
max_choices: null

points_rules:
  source: s-univen-prospectus
  subjects_counted: 7          # "only the 7 subjects with the highest marks"
  life_orientation: exclude
  percent_points: {per_percent: 0.1, from_percent: 40}   # 75% scores 7.5; under 40% adds nothing
  note: "UNIVEN scores your marks, not levels: 75% is 7.5 points."
  scale:                       # the levels beside UNIVEN's scoring scale (page 8)
    - {min_percent: 80, level: 7}
    - {min_percent: 70, level: 6}
    - {min_percent: 60, level: 5}
    - {min_percent: 50, level: 4}
    - {min_percent: 40, level: 3}
    - {min_percent: 30, level: 2}
    - {min_percent: 0, level: 1}

applications:
  source: s-univen-prospectus
  url: https://www.univen.ac.za/students/student-support-services/how-to-apply/
  how: "Apply online on UNIVEN's application wizard. You can save it and come back later."
  fee_cents: 0
  documents:
    source: s-univen-prospectus
    items:
      - "Copy of ID document or passport in PDF format"
      - "Grade 11 final (Term 4) report with the school's stamp if currently in Grade 12, or statement of Grade 12 results or copy of the Matric Certificate"
      - "Academic record and certificate of good conduct if you have already studied at another tertiary institution"
      - "Copy of study and residence permit, medical insurance and SAQA Evaluation Certificate for international applicants"
  after:
    - text: "Achievement of the minimum requirements does not guarantee an applicant admission to any programme."
      source: s-univen-prospectus
    - text: "The minimum points for admission to a bachelor's degree study are 26 and can be reviewed by the Senate from time to time."
      source: s-univen-prospectus
  windows:
    - intake: 2027
      source: s-univen-prospectus
      opens: 2026-05-01
      closes: 2026-09-30

