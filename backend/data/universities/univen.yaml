  url: https://www.univen.ac.za/students/student-support-services/how-to-apply/
  how: "Apply online on UNIVEN's application wizard. You can save it and come back later."
  fee_cents: 0
  windows:
    - intake: 2027
      source: s-univen-prospectus
      opens: 2026-05-01
      closes: 2026-09-30

programmes: []

