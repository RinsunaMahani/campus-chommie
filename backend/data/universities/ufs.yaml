  # 2026 EMS rule book (pages 8 and 9)

  - id: bcom_extended
    name: "BCom (extended curriculum programme)"
    faculty: "Faculty of Economic and Management Sciences"
    fields: [commerce]
    requirements:
      source: s-ufs-rb-ems-2026
      min_points: 24
      subject_minimums: {english: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 4}
            - subjects: {mathematics: 3}
              min_points: 28
      extras:
        - "UFS's 2026 EMS rule book: an AP of 24 to 27 with Mathematics 4, or an AP of 28 with Mathematics 3. With an AP of 28 or more and Mathematics 4, you'd meet the mainstream BCom instead."
        - "You can't apply for this directly: apply for the mainstream programme, and UFS places you here if you qualify and space allows, higher scores first (2027 prospectus)."

