# University of the Free State (UFS)
#
# Agent draft, read on 13 Oct 2026 (docs/research/universities.md). Which subjects count comes from the
# UFS's 2027 MBChB selection rules; the scale from its conversion table, read through a search engine. Its
# 2027 closing date wasn't found. Nobody has checked these values yet: release stays false until a person
# has compared every one with its source.
#
# The 172 programmes (agent draft, 14 Oct 2026) come from UFS's 2027 undergraduate prospectus, and its extended
# programmes from the 2026 faculty rule books; docs/research/ufs.md gives the pages and what to check first.

university: ufs
name: University of the Free State
city: Bloemfontein and QwaQwa
academic_year: 2027
province: Free State
province_source: s-ufs-where
release: false
max_choices: null

points_rules:
  source: s-ufs-rules
  subjects_counted: 7
  life_orientation: full
  count_from_level: 2
  note: "The UFS counts your four compulsory subjects and your two best others, and gives Life Orientation 1 point from 60%. We count your best six besides Life Orientation, which is the same when you take seven subjects."
  scale:
    - {min_percent: 90, level: 8}
    - {min_percent: 80, level: 7}
    - {min_percent: 70, level: 6}
    - {min_percent: 60, level: 5}
    - {min_percent: 50, level: 4}
    - {min_percent: 40, level: 3}
    - {min_percent: 30, level: 2}
    - {min_percent: 0, level: 1}
  subject_points:
    life_orientation:
      - {min_percent: 60, points: 1}
      - {min_percent: 0, points: 0}

applications:
  source: s-ufs-prospective
  url: https://www.ufs.ac.za/prospective
  windows:
    - intake: 2027
      source: s-ufs-prospectus-2027   # page 51, "Important application closing dates"
      opens: 2026-04-01               # page 51: "1 April 2026 ... application opening date" (checked 20 Oct 2026)
      closes: 2026-09-30              # every non-selection programme and the remaining selection programmes
      programme_closes:
        - closes: 2026-05-31
          programmes: [mbchb, bocc_ther, boptom, bsc_physiotherapy, bmedsc_radiation_science, bbiok, bsc_dietetics, bsport_coach]
        - closes: 2026-07-31
          programmes: [bnursing, bsw, barch]
      no_late_applications: true      # "If your application is received after the following closing dates, it will not be considered."
      note: "International applicants: 31 August 2026."

# Campuses from the university's own page (s-ufs-campuses), read on 22 Oct 2026. Agent draft.
campuses:
  - {id: bloemfontein, name: "Bloemfontein", source: s-ufs-campuses}
  - {id: south, name: "South (Bloemfontein)", source: s-ufs-campuses}
  - {id: qwaqwa, name: "Qwaqwa", source: s-ufs-campuses}

