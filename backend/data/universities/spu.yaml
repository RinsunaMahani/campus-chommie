# Sol Plaatje University (SPU)
#
# Official-source acceptance follows the owner's 25 October 2026 decision. Incomplete pack.
# The APS image supplied on 26 October matches the official admissions page's image.
# Owner accepted University Qualifications' seven-subject rule on 26 October 2026.
# Programmes come from the 2027 online prospectus and faculty pages; see docs/research/spu.md.

university: spu
name: Sol Plaatje University
city: Kimberley
academic_year: 2027
province: Northern Cape
province_source: s-spu-where
release: false
max_choices: null

points_rules:
  source: s-spu-seven-subjects
  subjects_counted: 7
  exact_subject_count: true
  life_orientation: full
  note: "All seven NSC subjects count. The seven-subject rule comes from University Qualifications, an independent calculator; the points table matches SPU's official image. Mathematics and Home Language receive bonuses; Mathematical Literacy and First Additional Language do not."
  scale:
    - {min_percent: 80, level: 7}
    - {min_percent: 70, level: 6}
    - {min_percent: 60, level: 5}
    - {min_percent: 50, level: 4}
    - {min_percent: 40, level: 3}
    - {min_percent: 30, level: 2}
    - {min_percent: 0, level: 1}
  other_points:
    - {min_percent: 90, points: 8}
    - {min_percent: 80, points: 7}
    - {min_percent: 70, points: 6}
    - {min_percent: 60, points: 5}
    - {min_percent: 50, points: 4}
    - {min_percent: 40, points: 3}
    - {min_percent: 30, points: 2}
    - {min_percent: 0, points: 1}
  home_language_points: &spu_bonus_points
    - {min_percent: 90, points: 10}
    - {min_percent: 80, points: 9}
    - {min_percent: 70, points: 8}
    - {min_percent: 60, points: 7}
    - {min_percent: 50, points: 5}
    - {min_percent: 40, points: 4}
    - {min_percent: 30, points: 2}
    - {min_percent: 0, points: 1}
  subject_points:
    mathematics: *spu_bonus_points
    life_orientation:
      - {min_percent: 90, points: 4}
      - {min_percent: 80, points: 3}
      - {min_percent: 70, points: 2}
      - {min_percent: 60, points: 1}
      - {min_percent: 0, points: 0}
# Official admissions-page table, corroborated by the user-supplied image on 26 October 2026.
points_how:
  source: s-spu-aps-image
  text: "SPU's scale: 90-100% is 8 points, down to 0-29% for 1. Mathematics and Home Language add 2 from 60% and 1 at 40-59%. Life Orientation scores 4, 3, 2 or 1 from 90, 80, 70 and 60%. The seven-subject total uses the independent University Qualifications calculator."

applications:
  source: s-spu-apply
  url: https://www.spu.ac.za/index.php/how-to-apply/
  windows:
    - intake: 2027
      source: s-spu-apply
      opens: null
      closes: 2026-10-31

# Minimum points are on SPU's own scale (levels to 8, with extra points for Mathematics, a home language and
# Life Orientation). The owner accepted the independent seven-subject rule. Page numbers are the
# online prospectus viewer's (docs/research/spu.md also gives the printed ones).
# Campuses from the university's own page (s-spu-prospectus), read on 22 Oct 2026. Agent draft.
campuses:
  - {id: kimberley, name: "Kimberley", note: "OpenStreetMap draws it in two parts: the central site and South Campus.", source: s-spu-prospectus}

programmes:

  # Faculty of Education (2027 prospectus, pages 7 to 9)

  - id: bed_foundation_phase
    name: "B.Ed. Foundation Phase Teaching (Grade R-3)"
    faculty: "Faculty of Education"
    fields: [education]
    requirements:
      source: s-spu-prospectus-2027       # page 7
      min_points: 30
      english_language_levels: {home: 4, first_additional: 5}
      subject_minimums: {english: 4, other_language: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 3}
            - subjects: {mathematical_literacy: 4}
      extras:
        - "English Home Language at level 4, or English First Additional Language at level 5."
        - "Your other language must be Afrikaans, Setswana or isiXhosa (home or first additional language)."
        - "Your NSC must show admission to bachelor's degree study."

  - id: bed_intermediate_maths_science
    name: "B.Ed. Intermediate Phase Teaching (Grades 4-6): Languages, Mathematics, Natural Science and Technology"
    faculty: "Faculty of Education"
    fields: [education]
    requirements:
      source: s-spu-prospectus-2027       # page 7
      min_points: 30
      english_language_levels: {home: 4, first_additional: 5}
      subject_minimums: {english: 4, other_language: 4, mathematics: 4, physical_sciences: 4, life_sciences: 4}
      extras:
        - "English Home Language at level 4, or English First Additional Language at level 5."
        - "Your other language must be Afrikaans, Setswana or isiXhosa (home or first additional language)."
        - "Your NSC must show admission to bachelor's degree study."

  - id: bed_intermediate_social_sciences
    name: "B.Ed. Intermediate Phase Teaching (Grades 4-6): Languages, Social Sciences and Life Skills"
    faculty: "Faculty of Education"
    fields: [education]
    requirements:
