  # Butterworth (pages 11 to 14). Each extended curriculum programme (ECP) asks fewer points and takes applicants one
  # level below the main stream in ONE of its subjects: its options list each way of doing that.

  - id: dip_building_technology
    name: "Diploma in Building Technology"
    faculty: "Faculty of Engineering, Built Environment and Information Technology"
    fields: [built_environment]
    requirements:
      source: s-wsu-brochure-2027
      min_points: 24
      subject_minimums: {english: 4}
      choices:
        - one_of:
            - subjects: {mathematics: 4}
            - subjects: {technical_mathematics: 5}
        - one_of:
            - subjects: {physical_sciences: 3}
            - subjects: {technical_sciences: 4}

  # The brochure says both "a rating of 3" and "one level below the required levels": for Technical Mathematics (5)
  # and Physical Sciences (3) these differ, so we use the stricter of the two (Technical Mathematics 4, Physical
  # Sciences not lowered).
