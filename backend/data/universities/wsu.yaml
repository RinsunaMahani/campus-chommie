# Walter Sisulu University (WSU)
#
# Agent draft, read on 13 Oct 2026 (docs/research/universities.md). Nobody has checked these values yet:
# release stays false until a person has compared every one with its source.
# The programmes are every first qualification in WSU's 2027 brochure (docs/research/wsu.md lists what to check
# first), and the Faculty of Education's programmes carry their own points rule: seven subjects, Life Orientation
# included, as WSU's example counts for Foundation Phase and as six of the faculty's other nine lists add up.

university: wsu
name: Walter Sisulu University
city: Mthatha, East London, Butterworth and Komani
academic_year: 2027
province: Eastern Cape
province_source: s-wsu-where
institution_type: comprehensive   # "one of six South African comprehensive universities" (DHET now counts nine)
institution_type_source: s-wsu-where
release: false
max_choices: null

points_rules:
  source: s-wsu-brochure
  subjects_counted: 6
  life_orientation: exclude
  note: "WSU counts English and one other language, then your four best other subjects; its example for Foundation Phase teaching counts seven, Life Orientation included."
  scale:
    - {min_percent: 90, level: 8}
    - {min_percent: 80, level: 7}
    - {min_percent: 70, level: 6}
    - {min_percent: 60, level: 5}
    - {min_percent: 50, level: 4}
    - {min_percent: 40, level: 3}
    - {min_percent: 30, level: 2}
    - {min_percent: 0, level: 1}

applications:
  source: s-wsu-apply
  url: https://www.wsu.ac.za/index.php/en/study-with-us/application-and-registration/how-to-apply-the-process
  how: "Apply online at applications.wsu.ac.za."
  fee_cents: 10000
  fee_note: "Not refunded."
  windows:
    - intake: 2027
      source: s-wsu-apply
      opens: 2026-06-01
      closes: 2026-10-31
      note: "Applicants from outside South Africa closed on 30 September 2026."

