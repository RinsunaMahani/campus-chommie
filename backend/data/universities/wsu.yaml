    name: "Diploma in Building Technology Extended Curriculum Programme (ECP)"
    faculty: "Faculty of Engineering, Built Environment and Information Technology"
    fields: [built_environment]
    requirements:
      source: s-wsu-brochure-2027
      min_points: 22
      choices:
