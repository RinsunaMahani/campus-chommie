            - subjects: {english: 3, mathematics: 4, physical_sciences: 3}
            - subjects: {english: 3, mathematics: 4, technical_sciences: 4}
            - subjects: {english: 3, technical_mathematics: 5, physical_sciences: 3}
            - subjects: {english: 3, technical_mathematics: 5, technical_sciences: 4}
            - subjects: {english: 4, mathematics: 3, physical_sciences: 3}
            - subjects: {english: 4, mathematics: 3, technical_sciences: 4}
            - subjects: {english: 4, technical_mathematics: 4, physical_sciences: 3}
            - subjects: {english: 4, technical_mathematics: 4, technical_sciences: 4}
            - subjects: {english: 4, mathematics: 4, technical_sciences: 3}
            - subjects: {english: 4, technical_mathematics: 5, technical_sciences: 3}
      extras:
        - "The extended programme takes applicants one level below the main stream's minimum in ONE of English, Mathematics (or Technical Mathematics) and Physical Sciences (or Technical Sciences)."

