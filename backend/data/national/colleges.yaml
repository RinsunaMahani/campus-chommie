# Colleges: public TVET colleges and DHET's registers of private institutions
#
# Agent draft, built on 20 Oct 2026 from four DHET publications (sources at the end), read with a script:
# every name, registration number, site and qualification is as printed there, typos included. Nobody has
# checked these values yet: release stays false until a person has compared them with the sources.
#
# Kept: each institution's name, registration number, status, province, website, sites of delivery and
# registered qualifications (DHET asks that published lists include the registered qualifications), and a
# public TVET college's office line and head-office location. Left out on purpose: contact persons' names,
# their phone numbers and email addresses, and principals' names.
#
# Statuses: public (a public TVET college), registered, provisionally_registered, cancelled (DHET: students
# shouldn't enrol; they will not be examined or certificated). `unregistered` is DHET's own list of illegal
# ("bogus") colleges. The private colleges register covers only NC(V) and adult education (AET): colleges
# offering only occupational (QCTO) programmes are exempt from it, so "not in a register" is not the same
# as "bogus".
#
# Gaps for the team (docs/OPEN_QUESTIONS.md): the IIE's number read from the register's plain text (its
# table cell is garbled); Empilweni Education and Adu Dlamini Business and Engineering Academy have no
# registration number in the register; three numbers appear on two entries each.
#
# website_check (20 Oct 2026): we opened each public TVET college's website as DHET lists it. 25 of the 50 no
# longer work (gone, parked, suspended, empty or under construction): the app shows no link for those, because
# anyone could buy a parked address. Argon found newer sites for many; a person must confirm each is the
# college's own before it replaces DHET's (docs/OPEN_QUESTIONS.md).

release: false
warning_signs:
  items:
  - Consultants promising jobs after graduation.
  - Consultants and websites offering two degrees for the price of one as well as huge discounts.
  - Use of nomenclatures to qualifications, for example, a Bachelor of Commerce degree is different form a Bachelor of Commerce
    in Financial Management degree.
  - Official-looking bogus colleges that use seals, crests and logos used by legitimate institutions such as the DHET, public
    universities and public colleges.
  - Exaggerated and numerous claims on accreditation in order to lend credibility to the college.
  - The names of colleges are similar or identical to those of prestigious universities such as Oxford University and Cambridge
    University.
  - Application form is questionable in that it does not require information or proof of formal schooling, identity documents,
    etc.
  - Diplomas and Degrees offered in a short period of time making it possible to receive several degrees in one year.
  - The absence of a physical address for the legal entity called the institution or the awarding body.
  - Local tuition centres purporting to offer “qualifications” on behalf of “foreign” and “international” universities.
  - The continued and undue emphasis on “international accreditation” and “international qualifications”.
  source: s-dhet-phei-register-2026-08
