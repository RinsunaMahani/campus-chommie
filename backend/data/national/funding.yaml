# National funding: NSFAS
#
# Agent draft, from NSFAS's own 2027 application pages read on 10 Oct 2026 (docs/research/nsfas.md). Nobody has
# checked these values yet: release stays false until a person has compared every one with its source. Every
# course-finder plan shows NSFAS beside its universities. The app never asks about income, disability or family
# circumstances: it shows NSFAS's own words, and the learner decides whether to apply.

release: false

funders:
  - id: nsfas
    name: "National Student Financial Aid Scheme (NSFAS)"
    short_name: NSFAS
    sector: government
    every_plan: true
    fields: any
    stages: [first_year, senior]
    who_can_apply:
      source: s-nsfas-home-2027
      items:
        - "South African citizens studying or planning to study at a public university or TVET college"
        - "SASSA grant recipients"
        - "Students from households earning up to R350 000 a year"
        - "Students with disabilities from households earning up to R600 000 a year"
    tips:
      source: s-nsfas-apply-2027   # "The eight most common reasons a document is sent back"
      items:
        - "A corner or edge is cut off in the photo."
        - "The image is blurry, dark, or has glare across the text."
        - "A signature is missing, or an electronic signature was used."
        - "It's written in pencil or coloured ink instead of black."
        - "Correction fluid was used, or a change wasn't initialled."
        - "Last year's version of the form was submitted."
        - "Only one page of a two-page form was uploaded."
        - "Names or ID numbers don't match the ID document."
    warnings:
      source: s-nsfas-apply-2027
      items:
        - "Never pay anyone to apply. NSFAS will never ask for your password or OTP."
        - "Use nsfas.org.za and my.nsfas.org.za only. Check the spelling in the address bar before you sign in."
    at_registration:
      text: "If NSFAS finds you eligible, your funding is confirmed once you register at a public university or TVET college."
      source: s-nsfas-apply-2027
    applications:
      source: s-nsfas-apply-2027
      url: "https://my.nsfas.org.za/"
      how: "Apply online on myNSFAS or in the official NSFAS app. Create your profile with your South African ID number, your cellphone number and your email address, then fill in your personal and household information, give consent, upload your documents and submit. You can save and finish later."
      fee_cents: 0
      contact: "Toll-free 08000 67327, USSD *134*67327#, info@nsfas.org.za"
      documents:
        source: s-nsfas-home-2027
        items:
          - "Your South African ID or birth certificate (a smart ID card: both sides)"
          - "The NSFAS 2027 consent form, signed by hand in black ink by you and by every parent, legal guardian or spouse on your application"
          - "If you're 34 or younger: the NSFAS declaration form, which confirms your parent or guardian details"
          - "If a parent, legal guardian or spouse earns an income: payslips for the last three months, a UIF statement, or an affidavit if the income is informal"
          - "If someone in your household gets a SASSA grant: nothing extra, because NSFAS checks with SASSA"
          - "If you have a disability: the disability annexure, completed and signed with a medical practitioner, in one file with your medical report"
          - "If you're under 18 and an orphan or a vulnerable child: the orphan or vulnerable child declaration, completed by a social worker"
          - "If a parent or guardian has died: a death certificate for each"
          - "If your parents are divorced or separated: the divorce decree, or the settlement agreement showing maintenance"
          - "If you're married, or a spouse signs for you: your marriage certificate and your spouse's ID"
          - "If you live with a legal guardian: proof of legal guardianship issued by a court"
          - "If a parent or legal guardian was retrenched: the retrenchment letter from the employer"
      after:
        - text: "Save your reference number, then follow your status in the tracker on myNSFAS."
          source: s-nsfas-home-2027
        - text: "You have 30 working days to answer any request for more information."
          source: s-nsfas-home-2027
        - text: "If your application is unsuccessful, myNSFAS shows the reason, and you can appeal within the appeal window."
          source: s-nsfas-apply-2027
      windows:
        - intake: 2027
          source: s-nsfas-apply-2027
          opens: 2026-09-18
          closes: 2026-10-31
          closing_time: "23:59"         # "South African time"
          no_late_applications: true    # "Late applications cannot be accepted"

sources:
  - id: s-nsfas-apply-2027
    url: "https://nsfas.org.za/content/how-to-apply.html"
    publisher: "National Student Financial Aid Scheme (NSFAS)"
    title: "NSFAS 2027 Applications: how to apply"
    retrieved: 2026-10-10
    last_verified: null
    verified_by: "agent draft, needs human check"
  - id: s-nsfas-home-2027
    url: "https://www.nsfas.org.za/content/"
    publisher: "National Student Financial Aid Scheme (NSFAS)"
    title: "NSFAS 2027 Applications (home page)"
    retrieved: 2026-10-10
    last_verified: null
    verified_by: "agent draft, needs human check"
