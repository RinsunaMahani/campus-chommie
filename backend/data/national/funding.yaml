  - id: funza_lushaka
    name: "Funza Lushaka Bursary Programme"
    short_name: Funza Lushaka
    sector: government
    fields: [education]
    stages: [first_year, senior]
    who_can_apply:
      source: s-funza-notes-2027
      items:
        - "South African citizens with a valid South African ID card"
        - "First-time applicants under the age of 30"
        - "Accepted (or provisionally accepted) into an approved BEd degree, with a student number"
        - "Intermediate, Senior and FET phase students specialise in at least two priority subject areas"
        - "First-time students: a bachelor's pass, with at least level 4 (50%) in the two subjects you'll specialise in teaching"
        - "Not for a PGCE, Higher Certificate, Honours, Master's or doctorate, or if you already have a teaching qualification"
        - "Not for subjects with too many teachers already: History, Geography, Accounting, Economics, Business Studies, EMS, Life Orientation and Physical Education"
        - "Students already funded re-apply every year: they must pass all their modules, with an average of at least 55%"
    covers:
      source: s-funza-notes-2027
      items:
        - "Tuition fees"
        - "Accommodation, including meals"
        - "Books and learning materials"
        - "Teaching practice"
        - "If possible, a small monthly allowance for living expenses"
        - "Up to a set amount: if your fees are higher, you pay the difference"
    obligations:
      source: s-funza-notes-2027
      items:
        - "Teach one year for every year the bursary paid for."
        - "Apply for teaching posts in public schools for six months after you qualify, and keep proof that you applied."
        - "If you break the conditions, such as changing your priority subjects, you repay the whole bursary with interest."
    tips:
      source: s-funza-notes-2027
      items:
        - "Apply only once you have a student number and an acceptance from your university."
        - "Send your supporting documents to your university's Funza Lushaka office."
        - "Changing universities after you apply rules you out: update your application while it's still open."
        - "No applications are considered after the closing date."
    applications:
      source: s-funza-notes-2027
      url: "https://www.funzalushaka.doe.gov.za/"
      how: "Apply online at funzalushaka.doe.gov.za or on the government's e-Services portal (eservices.gov.za): register, choose the Funza Lushaka Bursary Scheme, enter the OTP you're sent, accept the terms and click the 2027 application button."
      contact: "Your university's Funza Lushaka office first. If it can't help: 012 357 3000 or inquiries.funzalushaka@dbe.gov.za"
      windows:
        - intake: 2027
          source: s-funza-home-2027
          opens: 2026-10-01
          closes: 2027-01-31
          note: "Students already funded re-apply by Mon 30 Nov 2026."

