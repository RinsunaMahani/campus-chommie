# Every tunable number lives here, so calibration never touches code.
# These are starting values. Calibrate them with the student survey before the event.

workload:
  base_load:              # load per event type, before weighting and clustering
    quiz: 1
    assignment: 2
    practical: 3
    test: 3
    exam: 4
  cluster_hours: 48       # an event this close to another one counts extra
  cluster_multiplier: 1.5
  thresholds:
    amber: 4.0            # a week scoring at least this is amber
    red: 7.0              # a week scoring at least this is red

runway:
  late_days: 14           # the "what if it's two weeks late" scenario
  buffer_days: 3          # days of spending to spare before the life fund shows green
  horizon_days: 120       # how far ahead the runway is projected

forecast:
  ewma_alpha: 0.3         # how much the most recent day counts in the spending pace
  min_days_of_history: 5  # fewer logged days than this: use the student's essentials estimate
  spread_window: 14       # days used to measure how much spending varies

applications:
  closing_soon_days: 14   # an open application window this close to its closing date is "Closing soon"
  seen_open_days: 14      # a page that said "open" without dates counts as open this long after we read it

funding:
  per_choice: 5           # bursaries shown with each course-finder choice; the app links to the rest
  remind_days: [7, 1]     # saved funding: an alert when applications close within this many days (once each)

colleges:
  page_size: 40           # colleges in one page of the list
  min_query_chars: 3      # a shorter search or registration check is refused: it would match nearly everything
  max_matches: 8          # a registration check shows at most this many institutions whose names match

alerts:
  lookahead_weeks: 3      # a heavy week this many weeks ahead (this one included) raises an alert

timetable_import:
  line_tolerance: 2.0     # words this close in height (PDF points) are on one line of a timetable cell
  merge_gap_minutes: 10   # the same class in periods this close together is one class (a 5-minute changeover)
  max_rows: 2000          # classes or exam papers read from one PDF, at most
  max_exam_minutes: 480   # a longer "duration" on an exam list is a misread, so it is left out

timetable:
  day_starts: "07:00"     # "Find a time" looks for free time from here...
  day_ends: "21:00"       # ...to here, the student's own hours being theirs to change in the form
  buffer_minutes: 15      # left free before and after a class or plan, to get from one to the next
  step_minutes: 15        # suggested times start on the quarter hour
  per_day: 2              # at most this many suggestions on one day, so they spread over the week
  suggestions: 5          # at most this many suggestions in all

next_steps:
  max_steps: 3            # "Do this next" on Home shows at most this many
  due_days: 3             # a test or deadline this many days away (or nearer) becomes a step
  exam_days: 7            # an exam this many days away (or nearer) becomes a step
  funding_days: 14        # a saved bursary closing this many days away (or nearer)
  goal_days: 30           # a money goal falling due this many days away (or nearer)
  heavy_weeks_ahead: 2    # a heavy week this many weeks ahead (this one included)

money_pots:
  buffer_paydays: 1       # paydays to fund the emergency buffer over

money_checkin:
  default_day: "sunday"   # default weekly check-in day
  max_fixed_costs: 20     # maximum fixed costs a student can track

money_health:
  min_buffer_cents: 1     # minimum saved cents in buffer pot to count as funded
